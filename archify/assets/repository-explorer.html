<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Repository explorer</title>
<style>
:root{color-scheme:dark;--bg:#0b1220;--surface:#101c2c;--raised:#192b3d;--ink:#e7eef6;--muted:#adc0d2;--line:#304357;--accent:#6cddd0;--field:#0b1523;--space:24px}
:root[data-theme=light]{color-scheme:light;--bg:#f2f5f8;--surface:#fff;--raised:#e8eff4;--ink:#172b3e;--muted:#486078;--line:#becdda;--accent:#007b70;--field:#f6f9fb}
*{box-sizing:border-box;scrollbar-color:var(--line) var(--surface);scrollbar-width:thin}
html,body{width:100%;height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,sans-serif}
button,input,select{font:inherit;color:inherit}
button,select{background:var(--surface);border:1px solid var(--line);border-radius:8px;min-height:40px;padding:8px 12px;cursor:pointer}
button:hover,select:hover{background:var(--raised);border-color:var(--muted)}
button:active{background:var(--raised)}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,canvas:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
button[aria-pressed=true]{background:var(--accent);color:var(--bg);border-color:var(--accent)}
input{width:100%;min-height:44px;border:1px solid var(--line);border-radius:8px;background:var(--field);padding:10px 14px;caret-color:var(--accent)}
input::placeholder{color:var(--muted);opacity:1}
::selection{background:var(--accent);color:var(--bg)}
a{color:var(--accent);text-underline-offset:4px}
header{flex:none;padding:20px var(--space) 0;display:grid;grid-template-columns:minmax(190px,1fr) minmax(210px,360px) auto;gap:16px 24px;align-items:center;background:var(--surface);border-bottom:1px solid var(--line)}
header>div:first-child{min-width:0}
h1{font-size:18px;line-height:1.35;letter-spacing:-.02em;margin:0;overflow-wrap:anywhere}
#counts{font-size:12px;color:var(--muted);margin-top:6px;font-variant-numeric:tabular-nums}
#search-wrap{position:relative;min-width:0}
#results{position:absolute;top:calc(100% + 8px);left:0;right:0;max-height:52vh;overflow:auto;background:var(--surface);border-radius:12px;z-index:5;box-shadow:0 8px 32px #0004;padding:6px}
#results[hidden]{display:none}
#results button{display:block;text-align:left;width:100%;border:0;border-radius:6px;padding:12px;overflow-wrap:anywhere}
#results small{display:block;color:var(--muted);font-size:12px;margin-top:4px;line-height:1.5}
#results p{padding:12px;margin:0;color:var(--muted)}
.actions{display:flex;align-items:center;gap:8px;min-width:0}
#context{grid-column:1/-1;display:flex;align-items:center;gap:20px;min-width:0;padding:12px 0;border-top:1px solid var(--line)}
.breadcrumb{display:flex;gap:0;overflow-x:auto;align-items:center;flex:1;min-width:0;white-space:nowrap;scrollbar-width:none}
.breadcrumb button{flex:none;min-height:32px;border:0;background:transparent;font-size:12px;max-width:210px;overflow:hidden;text-overflow:ellipsis;padding:4px 8px;color:var(--muted)}
.breadcrumb button+button::before{content:'/';display:inline-block;margin-right:16px;color:var(--muted)}
.breadcrumb button:first-child{padding-left:0}
.breadcrumb button:last-child{color:var(--ink);font-weight:600}
#level{font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
#edges{font-size:12px;flex:none}
#workspace{flex:1;position:relative;min-height:0;display:flex;gap:16px;padding:16px;overflow:hidden}
#stage{flex:1;min-width:0;min-height:0;position:relative;overflow:hidden;background:var(--bg);border:1px solid var(--line);border-radius:12px}
canvas{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
canvas.dragging{cursor:grabbing}
.canvas-controls{position:absolute;bottom:20px;left:20px;display:flex;gap:4px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.canvas-controls button{border-color:transparent;min-width:40px;font-size:18px}
.canvas-controls #fit{font-size:12px;min-width:80px}
#hint{position:absolute;bottom:30px;right:24px;max-width:calc(100% - 310px);text-align:right;color:var(--muted);font-size:12px;pointer-events:none;background:var(--bg);padding:2px 0}
#inspector{width:368px;max-width:40vw;flex:none;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:auto;padding:var(--space);overscroll-behavior:contain}
#inspector[hidden]{display:none}
#inspector .heading{display:flex;justify-content:space-between;gap:16px;align-items:start;margin-bottom:20px}
#inspector .heading>div{min-width:0}
#inspector .heading button{flex:none}
#inspector h2{margin:0 0 8px;font-size:20px;line-height:1.35;overflow-wrap:anywhere}
#inspector h3{font-size:14px;margin:32px 0 12px;line-height:1.5}
#inspector p{color:var(--muted);margin:12px 0 16px;overflow-wrap:anywhere}
#inspector .path{font-size:12px;overflow-wrap:anywhere;line-height:1.7}
#inspector .type{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
#inspector .subtitle{font-size:15px;color:var(--ink)}
#inspector .group-label{margin:24px 0 8px;font-size:12px;font-weight:600;color:var(--ink)}
#inspector .row{width:100%;display:block;text-align:left;margin:0;padding:12px 4px;font-size:13px;overflow-wrap:anywhere;border:0;border-bottom:1px solid var(--line);border-radius:0;background:transparent}
#inspector .row:hover,#inspector .row:focus-visible{background:var(--raised)}
#inspector .row small{display:block;color:var(--muted);margin-top:4px;font-size:12px;line-height:1.5}
pre{white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.7 ui-monospace,SFMono-Regular,monospace;background:var(--field);padding:16px;border-radius:8px;color:var(--ink)}
summary{cursor:pointer;padding:12px 0;font-size:13px;line-height:1.5}
#inspector ul{padding-left:20px;color:var(--muted);font-size:14px;line-height:1.65}
#inspector li{margin-bottom:12px}
#status{flex:none;font-size:12px;color:var(--muted);min-height:28px;padding:0 var(--space) 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tour{max-width:160px;min-width:0;font-size:12px}#coverage{font-size:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
@media(max-width:1100px){header{grid-template-columns:minmax(0,1fr) auto;gap:16px}#search-wrap{grid-column:1/-1;grid-row:2}#context{gap:12px}#hint{bottom:82px;left:20px;right:auto;max-width:calc(100% - 40px);text-align:left}}
@media(max-width:760px){
 :root{--space:20px}
 header{padding:16px var(--space) 0;gap:12px}
 h1{font-size:16px}#counts{font-size:12px}#tour{max-width:130px}
 #context{display:grid;grid-template-columns:1fr auto;gap:8px 12px;padding:10px 0}
 .breadcrumb{grid-column:1/-1}.breadcrumb button{max-width:240px;font-size:12px}
 #workspace{padding:12px;gap:12px;flex-direction:column}
 #stage{min-height:180px}
 #inspector{width:auto;max-width:none;min-height:0;flex:0 1 44%;padding:20px}
 #inspector .heading{margin-bottom:16px}
 #hint{bottom:76px;left:16px;max-width:calc(100% - 32px);font-size:12px}
 .canvas-controls{left:16px;bottom:16px}
 #status{font-size:12px;padding-inline:16px}
}
@media(max-width:560px){header{grid-template-columns:minmax(0,1fr)}.actions{grid-row:2;justify-content:flex-start}#search-wrap{grid-row:3}#tour{max-width:none;flex:1}#hint{display:none}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<header>
 <div><h1 id="title">Repository explorer</h1><div id="counts">Loading source index…</div></div>
 <div id="search-wrap"><label class="sr" for="search">Find a folder, file or method</label><input id="search" placeholder="Find a file or method…  /" autocomplete="off" aria-controls="results" aria-expanded="false"><div id="results" hidden></div></div>
 <div class="actions"><select id="tour" aria-label="Explore a runtime flow"><option value="">Runtime flows</option></select><button id="coverage">Coverage</button><button id="theme" aria-label="Toggle color theme">Light</button></div>
 <div id="context"><nav id="breadcrumbs" class="breadcrumb" aria-label="Code location"></nav><span id="level">Project</span><select id="edges" aria-label="Connections shown"><option value="all">Connections</option><option value="selected">Selected only</option><option value="none">No lines</option></select></div>
</header>
<main id="workspace">
 <section id="stage" aria-label="Interactive repository map"><canvas id="canvas" tabindex="0" role="application" aria-label="Code map. Scroll to zoom toward the pointer. Drag to pan. Use plus, minus, arrow keys, and zero to reset. Search gives keyboard access to every file and method."></canvas>
 <div class="canvas-controls" aria-label="Map navigation"><button id="out" aria-label="Zoom out">−</button><button id="fit">Overview</button><button id="in" aria-label="Zoom in">+</button><button id="parent" aria-label="Zoom to enclosing box">Up</button></div>
 <div id="hint">Scroll or pinch to zoom · Drag to pan · Double-click a box to enter</div>
 </section>
 <aside id="inspector" aria-label="Source details" hidden></aside>
</main>
<div id="status" role="status" aria-live="polite">Preparing the map…</div>
<noscript>This explorer needs JavaScript. Open the saved HTML in a browser with JavaScript enabled.</noscript>
<script id="repository-data" type="application/json">__REPOSITORY_DATA__</script>
<script>
__METHOD_LAYOUT__
(() => {
'use strict';
const data=JSON.parse(document.getElementById('repository-data').textContent);
const canvas=document.getElementById('canvas'), ctx=canvas.getContext('2d'), stage=document.getElementById('stage');
const panel=document.getElementById('inspector'), status=document.getElementById('status'), search=document.getElementById('search'), results=document.getElementById('results');
const nodes=new Map(data.nodes.map(n=>[n.id,{...n,children:[]}])) , root=nodes.get('root');
for(const n of nodes.values()) if(n.parent) nodes.get(n.parent).children.push(n);
for(const n of nodes.values()) n.children.sort((a,b)=>(a.kind==='folder'?-1:0)-(b.kind==='folder'?-1:0)||a.label.localeCompare(b.label));
const methodNodes=data.nodes.filter(n=>n.kind==='method');
const outgoing=new Map(), incoming=new Map();
for(const edge of data.edges){if(!outgoing.has(edge.from))outgoing.set(edge.from,[]);outgoing.get(edge.from).push(edge);if(!incoming.has(edge.to))incoming.set(edge.to,[]);incoming.get(edge.to).push(edge);}
let camera={x:0,y:0,k:1},target={...camera},width=0,height=0,raf=0,lastTime=0,visible=[],selected=null,hover=null,edgeMode='all',initialized=false,saveTimer=0;
let focus={ids:new Set(),containers:new Set(),edges:0},readingPath=new Set(),readingReveal=0;
let theme=matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';
const reduced=matchMedia('(prefers-reduced-motion:reduce)');
const palettes={dark:{bg:'#0b1220',ink:'#e7eef6',muted:'#b0c2d3',line:'#43596e',edge:'#79b8c4',selected:'#7eefe0',file:'#132737',method:'#163d43',folder:'#101e2e'},light:{bg:'#f2f5f8',ink:'#172b3e',muted:'#486078',line:'#9aafc2',edge:'#367e8d',selected:'#007b70',file:'#e8f3f2',method:'#d5efeb',folder:'#edf2f7'}};
const accents={'Robot code':'#37b7a0','Local Pedro core':'#58a6d9','Robot controller':'#738fbd','SDK samples':'#8a89b8','Tests and stubs':'#b18ab8','Tools':'#d2aa60','Documentation':'#7e9dad','Build and resources':'#7e9dad','Project':'#79b8c4'};
const clamp=(value,min,max)=>Math.max(min,Math.min(max,value));
const make=(tag,text,cls)=>{const e=document.createElement(tag);if(text!=null)e.textContent=text;if(cls)e.className=cls;return e;};
const label=n=>n.label;
function count(n){n.fileCount=n.kind==='file'?1:0;n.methodCount=n.kind==='method'?1:0;for(const child of n.children){count(child);n.fileCount+=child.fileCount;n.methodCount+=child.methodCount;}}
count(root);
function layout(n){
 if(n.kind==='method'){n.w=304;n.h=80;n.header=0;return;}
 if(n.kind==='file'){
  layoutMethods(n,outgoing);
  return;
 }
 // Collapse only empty path chains; retain every original directory in search and breadcrumbs.
 let branch=n;
 while(branch.children.length===1&&branch.children[0].kind==='folder')branch=branch.children[0];
 n.displayChildren=branch.children;n.compactPath=branch.path;
 if(branch!==n&&!n.summary)n.summary=branch.summary;
 for(const child of n.displayChildren)layout(child);
 const children=[...n.displayChildren].sort((a,b)=>b.h-a.h||a.label.localeCompare(b.label));
 // Larger ownership regions need proportional space to stay distinct when zoomed out.
 const gap=Math.max(112,Math.sqrt(children.reduce((a,c)=>a+c.w*c.h,0)/Math.max(1,children.length))*.12),padding=Math.max(96,gap);
 const area=children.reduce((a,c)=>a+(c.w+gap)*(c.h+gap),0);
 const limit=Math.max(...children.map(c=>c.w+padding*2),Math.sqrt(area)*1.35,440);
 let x=padding,y=0,rowHeight=0,maxX=0;
 for(const child of children){if(x>padding&&x+child.w+padding>limit){x=padding;y+=rowHeight+gap;rowHeight=0;}child.x=x;child.y=y;maxX=Math.max(maxX,x+child.w);x+=child.w+gap;rowHeight=Math.max(rowHeight,child.h);}
 n.w=Math.max(440,maxX+padding);n.header=Math.max(144,n.w*.08);n.h=y+rowHeight+n.header+padding;
 for(const child of children)child.y+=n.header;
 if(branch!==n){let inner=n.children[0];while(inner!==branch){inner.alias=n;inner=inner.children[0];}branch.alias=n;}
}
layout(root);
function place(n,x,y){n.x=x;n.y=y;for(const child of n.displayChildren||n.children)place(child,x+child.x,y+child.y);}
place(root,0,0);
for(const n of nodes.values())if(n.alias){n.x=n.alias.x;n.y=n.alias.y;n.w=n.alias.w;n.h=n.alias.h;n.header=n.alias.header;}
function children(n){return n.displayChildren||n.children;}
function ancestors(n){const a=[];while(n){a.unshift(n);n=nodes.get(n.parent);}return a;}
function neighborhood(){
 const ids=new Set(),containers=new Set();let edges=0;
 if(selected?.kind==='method'){ids.add(selected.id);const adjacent=[...(outgoing.get(selected.id)||[]),...(incoming.get(selected.id)||[])];edges=adjacent.length;for(const edge of adjacent){ids.add(edge.from);ids.add(edge.to);}for(const id of ids)for(const owner of ancestors(nodes.get(id))){containers.add(owner.id);if(owner.alias)containers.add(owner.alias.id);}}
 return{ids,containers,edges};
}
function sourceLink(n,line=n.line||1){const repo=data.repository.url;return /^https:\/\/github\.com\//.test(repo)?repo+'/blob/'+data.repository.revision+'/'+n.path.split('/').map(encodeURIComponent).join('/')+'#L'+line:null;}
function applyTheme(){document.documentElement.dataset.theme=theme;document.getElementById('theme').textContent=theme==='dark'?'Light':'Dark';requestDraw();}
document.getElementById('theme').onclick=()=>{theme=theme==='dark'?'light':'dark';applyTheme();};
document.getElementById('title').textContent=data.title.replace(' · Repository explorer','');document.title=data.title;
const c=data.coverage;document.getElementById('counts').textContent=`${c.files} files · ${c.methods.toLocaleString()} methods · ${c.resolvedCalls.toLocaleString()} static call links`;
function requestDraw(){if(!raf)raf=requestAnimationFrame(draw);}
function minimum(){return Math.min((width-48)/root.w,(height-48)/root.h)*.55;}
function fit(n,instant=false){n=n.alias||n;const padding=width<760?28:56,bottom=width<560?80:112;const k=clamp(Math.min((width-padding*2)/n.w,Math.max(40,height-padding-bottom)/n.h),minimum(),3);target={k,x:width/2-(n.x+n.w/2)*k,y:padding+(height-padding-bottom)/2-(n.y+n.h/2)*k};if(instant||reduced.matches)camera={...target};requestDraw();}
function zoom(factor,x=width/2,y=height/2){const k=clamp(target.k*factor,minimum(),5);const wx=(x-target.x)/target.k,wy=(y-target.y)/target.k;target={k,x:x-wx*k,y:y-wy*k};if(reduced.matches)camera={...target};requestDraw();}
function text(value,x,y,maxWidth,font,color,alpha=1){if(maxWidth<20||alpha<=0)return;ctx.save();ctx.globalAlpha*=alpha;ctx.font=font;ctx.strokeStyle=ctx.fillStyle;ctx.lineWidth=3;ctx.lineJoin='round';ctx.fillStyle=color;let s=value;if(ctx.measureText(s).width>maxWidth){while(s.length&&ctx.measureText(s+'…').width>maxWidth)s=s.slice(0,-1);s+='…';}ctx.strokeText(s,x,y);ctx.fillText(s,x,y);ctx.restore();}
function rounded(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,Math.min(r,w/2,h/2));}
function detail(n){
 if(n===root)return 1;
 const natural=n.kind==='folder'?clamp((n.header*camera.k-38)/28,0,1):clamp((n.header*camera.k-22)/16,0,1);
 return Math.max(natural,n!==selected&&readingPath.has(n.id)?readingReveal:0);
}
function collect(n,alpha=1,depth=0){
 const x=n.x*camera.k+camera.x,y=n.y*camera.k+camera.y,w=n.w*camera.k,h=n.h*camera.k;
 if(x>width+30||y>height+30||x+w<-30||y+h<-30||w<4||h<4)return;
 const item={n,x,y,w,h,alpha,depth};visible.push(item);
 if(n.kind==='method')return;
 const descend=detail(n);
 if(descend<=0)return;
 for(const child of children(n)){
  const naturalFade=child.kind==='method'?clamp((child.w*camera.k-36)/44,0,1):clamp((Math.min(child.w,child.h)*camera.k-18)/30,0,1);
  const fade=Math.max(naturalFade,readingPath.has(child.id)?readingReveal:0);
  if(fade>.01)collect(child,alpha*descend*fade,depth+1);
 }
}
function drawBox(item,p){
 const {n,x,y,w,h}=item;const connected=focus.ids.has(n.id),alpha=item.alpha*(focus.ids.size?(connected?1:focus.containers.has(n.id)?.72:.15):1);ctx.save();ctx.globalAlpha=alpha;
 const active=selected?.id===n.id||hover?.id===n.id||connected;
 ctx.fillStyle=p[n.kind]||p.folder;rounded(x,y,w,h,n.kind==='method'?5:9);ctx.fill();
 ctx.strokeStyle=active?p.selected:n.kind==='folder'?(accents[n.category]||p.line):p.line;ctx.lineWidth=active?2:1;ctx.globalAlpha*=active?1:n.kind==='folder'?.65:.8;ctx.stroke();
 ctx.restore();
}
function drawLabels(item,p){
 const {n,x,y,w,h}=item;ctx.save();ctx.globalAlpha=item.alpha*(focus.ids.size?(focus.ids.has(n.id)?1:focus.containers.has(n.id)?.72:.15):1);
 // A glyph-sized background outline keeps bright lines from striking through letters.
 ctx.fillStyle=p[n.kind]||p.folder;
 if(n.kind==='method'){
  if(w>72&&h>18){const inset=Math.min(18,w*.1);text(n.label,x+inset,y+Math.min(30,h*.56),w-inset*2,`500 ${clamp(14*camera.k,11,16)}px ui-monospace,monospace`,p.ink);if(h>54)text(`${n.ownerName.split('.').at(-1)} · L${n.line}`,x+inset,y+Math.min(54,h*.82),w-inset*2,'12px system-ui',p.muted);}
 }else{
  const band=Math.min(n.header*camera.k,h*.4),fs=n.kind==='folder'?clamp(band*.34,12,23):clamp(band*.4,14,20),inset=clamp(w*.035,16,28);
  const collapsed=1-detail(n);
  if(w>72&&h>40&&collapsed>.01){const size=clamp(w*.065,12,24),counts=n.kind==='file'?`${n.methodCount} methods · ${n.language}`:`${n.fileCount} files · ${n.methodCount} methods`;text(label(n),x+inset,y+h*.43,w-inset*2,`600 ${size}px system-ui`,p.ink,collapsed);if(w>120&&h>85)text(n.subtitle||counts,x+inset,y+h*.43+28,w-inset*2,'12px system-ui',p.muted,collapsed);if(n.subtitle&&w>120&&h>130)text(counts,x+inset,y+h*.43+50,w-inset*2,'12px system-ui',p.muted,collapsed);}
  if(w>90&&h>40&&collapsed<.99){text(label(n),x+inset,y+(band>=60?32:Math.min(band*.64,30)),w-inset*2,`600 ${fs}px system-ui`,p.ink,1-collapsed);if(w>180&&band>=64){const sub=n.subtitle||(n.kind==='file'?`${n.children.length} ${n.language==='Python'?'functions':'methods'} · ${n.language}`:n.summary||n.compactPath||n.path||'Folders → files → methods');text(sub,x+inset,y+54,w-inset*2,'12px system-ui',p.muted,1-collapsed);}}
 }
 if(n.kind==='file'&&camera.k>.28){
  ctx.globalAlpha*=clamp((camera.k-.2)/.14,0,1);
  for(const section of n.sections){
   const sx=x+section.x*camera.k,sy=y+section.y*camera.k,sw=section.w*camera.k;
   text(section.owner.split('.').at(-1),sx,sy+18*camera.k,sw,`600 ${clamp(14*camera.k,11,15)}px ui-monospace,monospace`,p.ink);
   for(const block of section.blocks){
    const bx=x+block.x*camera.k,by=y+block.y*camera.k;
    text(block.label,bx,by+18*camera.k,block.w*camera.k,`${clamp(12*camera.k,11,13)}px system-ui`,p.muted);
   }
  }
 }
 ctx.restore();
}
function drawEdges(p){
 const labels=[];
 if(edgeMode==='none')return labels;
 const drawn=new Map(visible.filter(v=>v.alpha>.4).map(v=>[v.n.id,v]));
 const cache=new Map();
 function representative(id){if(cache.has(id))return cache.get(id);let node=nodes.get(id),found;while(node){if(drawn.has(node.id)){found=drawn.get(node.id);break;}if(node.alias&&drawn.has(node.alias.id)){found=drawn.get(node.alias.id);break;}node=nodes.get(node.parent);}cache.set(id,found);return found;}
 const groups=new Map();
 function belongs(id){const node=nodes.get(id);return selected&&(selected.kind==='method'?id===selected.id:selected.kind==='file'?node.path===selected.path:selected===root||node.path===selected.path||node.path.startsWith(selected.path+'/'));}
 for(const edge of data.edges){
  if(edgeMode==='selected'&&!belongs(edge.from)&&!belongs(edge.to))continue;
  const a=representative(edge.from),b=representative(edge.to);if(!a||!b||a.n===b.n||a.n===root||b.n===root)continue;

function breadcrumb(n){const chain=ancestors(n||root).filter((item,i,all)=>!item.alias||i===all.length-1);const nav=document.getElementById('breadcrumbs');nav.replaceChildren();for(const item of chain){const b=make('button',item===root?'Project':label(item));b.title=item.path;b.onclick=()=>{selected=item;fit(item);breadcrumb(item);};nav.append(b);}nav.scrollLeft=nav.scrollWidth;}
function remember(){clearTimeout(saveTimer);saveTimer=setTimeout(()=>{const params=new URLSearchParams({layout:'calls-v3',x:camera.x.toFixed(2),y:camera.y.toFixed(2),z:camera.k.toFixed(5)});if(selected)params.set('node',selected.id);try{history.replaceState(null,'','#'+params);}catch(e){if(e.name!=='SecurityError')throw e;}},250);}
function draw(time){
 raf=0;const dt=Math.min(50,lastTime?time-lastTime:16);lastTime=time;
 const t=reduced.matches?1:1-Math.exp(-dt/65);
 camera.x+=(target.x-camera.x)*t;camera.y+=(target.y-camera.y)*t;camera.k+=(target.k-camera.k)*t;
 const moving=Math.abs(camera.x-target.x)+Math.abs(camera.y-target.y)+Math.abs(camera.k-target.k)*100>.06;
 if(!moving)camera={...target};
 const dpr=Math.min(devicePixelRatio||1,2);ctx.setTransform(dpr,0,0,dpr,0,0);const p=palettes[theme];ctx.fillStyle=p.bg;ctx.fillRect(0,0,width,height);
 focus=neighborhood();
 // Fitting a selection must reveal its ownership path even in a short viewport.
 readingPath=new Set(selected?ancestors(selected).flatMap(n=>[n.id,n.alias?.id]).filter(Boolean):[]);

 visible=[];collect(root);
 // Connections cross box surfaces, while labels remain above every connection.
 for(const item of visible)drawBox(item,p);
 const edgeLabels=drawEdges(p);ctx.fillStyle=p.bg;
 for(const {count,x,y} of edgeLabels)text(String(count),x,y,40,'11px system-ui',p.ink,.95);
 for(const item of visible)drawLabels(item,p);

 document.getElementById('hint').textContent=focus.ids.size?'Callers and calls highlighted · Click empty canvas to clear':'Scroll or pinch to zoom · Drag to pan · Double-click a box to enter';
 const selectedBox=visible.find(item=>item.n.id===selected?.id);canvas.dataset.selectedBounds=selectedBox?JSON.stringify({x:selectedBox.x,y:selectedBox.y,w:selectedBox.w,h:selectedBox.h}):'';
 canvas.dataset.zoom=camera.k.toFixed(6);canvas.dataset.cameraX=camera.x.toFixed(3);canvas.dataset.cameraY=camera.y.toFixed(3);canvas.dataset.visibleNodes=String(visible.length);canvas.dataset.ready='true';
 const middle=hit(width/2,height/2);const detail=visible.some(v=>v.n.kind==='method'&&v.alpha>.7)?'Methods':visible.some(v=>v.n.kind==='file'&&v.alpha>.7)?'Files':camera.k>minimum()*2.5?'Folders':'Project';

function hit(x,y){for(let i=visible.length-1;i>=0;i--){const r=visible[i];if(r.alpha>.45&&x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h)return r.n;}return root;}
function point(event){const r=canvas.getBoundingClientRect();return{x:event.clientX-r.left,y:event.clientY-r.top};}
canvas.addEventListener('wheel',event=>{event.preventDefault();event.stopPropagation();const p=point(event),unit=event.deltaMode===1?16:event.deltaMode===2?height:1;const dx=event.deltaX*unit,dy=event.deltaY*unit;if(event.shiftKey||Math.abs(dx)>Math.abs(dy)*1.5){target.x-=(event.shiftKey?dy:dx);requestDraw();return;}zoom(Math.exp(-clamp(dy,-180,180)*(event.ctrlKey?.009:.0025)),p.x,p.y);},{passive:false});

canvas.addEventListener('dblclick',event=>{event.preventDefault();const p=point(event),n=hit(p.x,p.y);selected=n;fit(n);breadcrumb(n);});
function closePanel(){panel.hidden=true;resize();}
function clearSelection(){selected=null;closePanel();breadcrumb(root);status.textContent=defaultStatus;requestDraw();}
function panelHeader(title,type){panel.replaceChildren();panel.hidden=false;resize();const heading=make('div',null,'heading');const inner=make('div');inner.append(make('h2',title),make('div',type,'type'));const close=make('button','Close');close.onclick=closePanel;heading.append(inner,close);panel.append(heading);}
function row(n,caption){const b=make('button',label(n),'row'),detail=[n.subtitle,caption].filter(Boolean).join(' · ');if(detail)b.append(make('small',detail));b.onclick=()=>{select(n);fit(n);};return b;}
function connectionRows(title,edges,direction){
 if(!edges.length)return;panel.append(make('h3',title+' · '+edges.length));
 const unique=new Map(),names={call:'Static call candidate',reference:'Method reference',import:'Import'};
 for(const edge of edges){const id=direction==='out'?edge.to:edge.from,key=id+'|'+edge.kind;if(!unique.has(key))unique.set(key,{n:nodes.get(id),kind:edge.kind,sites:new Map()});const owner=nodes.get(edge.from);unique.get(key).sites.set(owner.path+':'+edge.line,{owner,line:edge.line});}

}
function select(n){
 selected=n;breadcrumb(n);panelHeader(label(n),n.kind==='method'?`${n.language} · ${n.ownerName}`:n.kind==='file'?`${n.language} file`:'Folder');

function coverage(){panelHeader('Source coverage','Repository index');panel.append(make('p',`${c.files} tracked files; ${c.javaFiles} Java files and ${c.pythonFiles} Python files parsed. ${c.methods} methods, constructors and functions.`));panel.append(make('p',`${c.resolvedCalls} of ${c.callSites} call sites have conservative local links. ${c.unresolvedCalls} external or unresolved sites remain visible in method details. ${c.imports} local import links.`));panel.append(make('p','Revision '+data.repository.revision,'path'));const ul=make('ul');for(const limit of data.limitations)ul.append(make('li',limit));panel.append(ul);panel.append(make('h3','Browse the entire project'));for(const node of root.children)panel.append(row(node,node.category));}

search.addEventListener('input',()=>{const q=search.value.trim().toLowerCase();results.replaceChildren();results.hidden=!q;search.setAttribute('aria-expanded',String(!!q));if(!q)return;const matches=[...nodes.values()].filter(n=>n!==root&&(n.path+' '+n.label+' '+(n.ownerName||'')).toLowerCase().includes(q));matches.sort((a,b)=>(a.label.toLowerCase().startsWith(q)?-1:0)-(b.label.toLowerCase().startsWith(q)?-1:0)||a.path.localeCompare(b.path));for(const n of matches.slice(0,60)){const b=make('button',label(n));b.append(make('small',`${n.subtitle?n.subtitle+' · ':''}${n.kind} · ${n.path}${n.line?' · L'+n.line:''}`));b.onclick=()=>{results.hidden=true;search.setAttribute('aria-expanded','false');select(n);fit(n);};results.append(b);}if(!matches.length)results.append(make('p','No matching file or method.'));if(matches.length>60)results.append(make('p',`${matches.length} matches. Refine your search to see the rest.`));});
