ex_pattern)\n        self.assertNotEqual(r, \"_this_is_a_test_\")\n\n    def test_replacements(self):\n        txt = '10 | 20 %'\n        r = slugify(txt, allow_unicode=True, replacements=[['|', 'or'], ['%', 'percent']])\n        self.assertEqual(r, \"10-or-20-percent\")\n\n        txt = 'I ♥ 🦄'\n        r = slugify(txt, allow_unicode=True, replacements=[['♥', 'amour'], ['🦄', 'licorne']])\n        self.assertEqual(r, \"i-amour-licorne\")\n\n        txt = 'I ♥ 🦄'\n        r = slugify(txt, allow_unicode=True, replacements=[['♥', 'სიყვარული'], ['🦄', 'licorne']])\n        self.assertEqual(r, \"i-სიყვარული-licorne\")\n\n    def test_replacements_german_umlaut_custom(self):\n        txt = 'ÜBER Über German Umlaut'\n        r = slugify(txt, allow_unicode=True, replacements=[['Ü', 'UE'], ['ü', 'ue']])\n        self.assertEqual(r, \"ueber-ueber-german-umlaut\")\n\n    def test_emojis(self):\n        \"\"\"\n        allowing unicode shouldn't allow emojis, even in replacements.\n        the only exception is when it is allowed by the regex_pattern. regex_pattern overrules all\n        \"\"\"\n        txt = 'i love 🦄'\n        r = slugify(txt, allow_unicode=True)\n        self.assertEqual(r, \"i-love\")\n\n        txt = 'i love 🦄'\n        r = slugify(txt, allow_unicode=True, decimal=True)\n        self.assertEqual(r, \"i-love\")\n\n        txt = 'i love 🦄'\n        r = slugify(txt, allow_unicode=True, hexadecimal=True)\n        self.assertEqual(r, \"i-love\")\n\n        txt = 'i love 🦄'\n        r = slugify(txt, allow_unicode=True, entities=True)\n        self.assertEqual(r, \"i-love\")\n\n        txt = 'i love you'\n        r = slugify(txt, allow_unicode=True, replacements=[['you', '🦄']])\n        self.assertEqual(r, \"i-love\")\n\n        txt = 'i love 🦄'\n        r = slugify(txt, allow_unicode=True, regex_pattern=r'[^🦄]+')\n        self.assertEqual(r, \"🦄\")\n\n\nclass TestUtils(unittest.TestCase):\n\n    def test_smart_truncate_no_max_length(self):\n        txt = '1,000 reasons you are #1'\n        r = smart_truncate(txt)\n        self.assertEqual(r, txt)\n\n    def test_smart_truncate_no_seperator(self):\n        txt = '1,000 reasons you are #1'\n        r = smart_truncate(txt, max_length=100, separator='_')\n        self.assertEqual(r, txt)\n\n\nPY3 = sys.version_info.major == 3\n\n\n@contextmanager\ndef captured_stderr():\n    backup = sys.stderr\n    sys.stderr = io.StringIO() if PY3 else io.BytesIO()\n    try:\n        yield sys.stderr\n    finally:\n        sys.stderr = backup\n\n\n@contextmanager\ndef loaded_stdin(contents):\n    backup = sys.stdin\n    sys.stdin = io.StringIO(contents) if PY3 else io.BytesIO(contents)\n    try:\n        yield sys.stdin\n    finally:\n        sys.stdin = backup\n\n\nclass TestCommandParams(unittest.TestCase):\n    DEFAULTS = {\n        'entities': True,\n        'decimal': True,\n        'hexadecimal': True,\n        'max_length': 0,\n        'word_boundary': False,\n        'save_order': False,\n        'separator': '-',\n        'stopwords': None,\n        'lowercase': True,\n        'replacements': None\n    }\n\n    def get_params_from_cli(self, *argv):\n        args = parse_args([None] + list(argv))\n        return slugify_params(args)\n\n    def make_params(self, **values):\n        return dict(self.DEFAULTS, **values)\n\n    def assertParamsMatch(self, expected, checked):\n        reduced_checked = {}\n        for key in expected.keys():\n            reduced_checked[key] = checked[key]\n        self.assertEqual(expected, reduced_checked)\n\n    def test_defaults(self):\n        params = self.get_params_from_cli()\n        self.assertParamsMatch(self.DEFAULTS, params)\n\n    def test_negative_flags(self):\n        params = self.get_params_from_cli('--no-entities', '--no-decimal', '--no-hexadecimal', '--no-lowercase')\n        expected = self.make_params(entities=False, decimal=False, hexadecimal=False, lowercase=False)\n        self.assertFalse(expected['lowercase'])\n        self.assertFalse(expected['word_boundary'])\n        self.assertParamsMatch(expected, params)\n\n    def test_affirmative_flags(self):\n        params = self.get_params_from_cli('--word-boundary', '--save-order')\n        expected = self.make_params(word_boundary=True, save_order=True)\n        self.assertParamsMatch(expected, params)\n\n    def test_valued_arguments(self):\n        params = self.get_params_from_cli('--stopwords', 'abba', 'beatles', '--max-length', '98', '--separator', '+')\n        expected = self.make_params(stopwords=['abba', 'beatles'], max_length=98, separator='+')\n        self.assertParamsMatch(expected, params)\n\n    def test_replacements_right(self):\n        params = self.get_params_from_cli('--replacements', 'A->B', 'C->D')\n        expected = self.make_params(replacements=[['A', 'B'], ['C', 'D']])\n        self.assertParamsMatch(expected, params)\n\n    def test_replacements_wrong(self):\n        with self.assertRaises(SystemExit) as err, captured_stderr() as cse:\n            self.get_params_from_cli('--replacements', 'A--B')\n        self.assertEqual(err.exception.code, 2)\n        self.assertIn(\"Replacements must be of the form: ORIGINAL->REPLACED\", cse.getvalue())\n\n    def test_text_in_cli(self):\n        params = self.get_params_from_cli('Cool Text')\n        expected = self.make_params(text='Cool Text')\n        self.assertParamsMatch(expected, params)\n\n    def test_text_in_cli_multi(self):\n        params = self.get_params_from_cli('Cool', 'Text')\n        expected = self.make_params(text='Cool Text')\n        self.assertParamsMatch(expected, params)\n\n    def test_text_in_stdin(self):\n        with loaded_stdin(\"Cool Stdin\"):\n            params = self.get_params_from_cli('--stdin')\n        expected = self.make_params(text='Cool Stdin')\n        self.assertParamsMatch(expected, params)\n\n    def test_two_text_sources_fails(self):\n        with self.assertRaises(SystemExit) as err, captured_stderr() as cse:\n            self.get_params_from_cli('--stdin', 'Text')\n        self.assertEqual(err.exception.code, 2)\n        self.assertIn(\"Input strings and --stdin cannot work together\", cse.getvalue())\n\n    def test_multivalued_options_with_text(self):\n        text = \"the quick brown fox jumps over the lazy dog in a hurry\"\n        cli_args = \"--stopwords the in a hurry -- {}\".format(text).split()\n        params = self.get_params_from_cli(*cli_args)\n        self.assertEqual(params['text'], text)\n        self.assertEqual(params['stopwords'], ['the', 'in', 'a', 'hurry'])\n\n\nif __name__ == '__main__':  # pragma: nocover\n    unittest.main()\n","tests/test_legacy_backend_errors.py":"\"\"\"Exercise error contracts of the frozen API without altering legacy code.\"\"\"\nimport importlib\nfrom unittest.mock import patch\nimport pytest\nfrom slugify import slugify\n\nlegacy = importlib.import_module('slugify._legacy')\n\n\ndef test_legacy_rejects_non_text_input():\n    with pytest.raises(TypeError, match='text must be str, bytes or bytearray'):\n        slugify(123)\n\n\ndef test_auto_propagates_missing_transitive_dependency():\n    error = ModuleNotFoundError(\"No module named 'internal_dependency'\", name='internal_dependency')\n    with patch.object(legacy, 'import_module', side_effect=error):\n        with pytest.raises(ModuleNotFoundError) as raised:\n            slugify('café', backend='auto')\n    assert raised.value is error\n\n\ndef test_explicit_backend_is_imported_without_fallback():\n    class Backend:\n        @staticmethod\n        def unidecode(text):\n            assert text == 'cafe\\u0301'\n            return 'cafe'\n    with patch.object(legacy, 'import_module', return_value=Backend) as load:\n        assert slugify('café', backend='text-unidecode') == 'cafe'\n    load.assert_called_once_with('text_unidecode')\n","tests/test_modern_combining_marks.py":"import re\nimport unicodedata\nimport unittest\n\nfrom slugify import slugify\nfrom slugify.slugify import _replace_disallowed_unicode\n\n\ndef modern(text, **kwargs):\n    return slugify(text, allow_unicode=True, algorithm='modern', **kwargs)\n\n\nclass ModernCombiningMarkTests(unittest.TestCase):\n    \"\"\"Issue #214: combining marks and joiners must not split Unicode words.\"\"\"\n\n    def test_scripts_with_combining_marks_stay_whole(self):\n        cases = (\n            ('नमस्ते दुनिया', 'नमस्ते-दुनिया'),  # Hindi\n            ('தமிழ் மொழி', 'தமிழ்-மொழி'),  # Tamil\n            ('বাংলা ভাষা', 'বাংলা-ভাষা'),  # Bengali\n            ('ਪੰਜਾਬੀ ਭਾਸ਼ਾ', 'ਪੰਜਾਬੀ-ਭਾਸ਼ਾ'),  # Gurmukhi\n            ('తెలుగు భాష', 'తెలుగు-భాష'),  # Telugu\n            ('ภาษาไทย ดี', 'ภาษาไทย-ดี'),  # Thai\n            ('ភាសាខ្មែរ', 'ភាសាខ្មែរ'),  # Khmer\n            ('မြန်မာစာ', 'မြန်မာစာ'),  # Myanmar\n            ('مَرْحَبًا بِكُمْ', 'مَرْحَبًا-بِكُمْ'),  # Arabic with harakat\n            ('שָׁלוֹם עוֹלָם', 'שָׁלוֹם-עוֹלָם'),  # Hebrew with niqqud\n            ('ජනාධිපතිවරයා පාර්ලිමේන්තුවට ගියේය',\n             'ජනාධිපතිවරයා-පාර්ලිමේන්තුවට-ගියේය'),  # Sinhala\n        )\n        for text, expected in cases:\n            with self.subTest(text=text):\n                self.assertEqual(modern(text), unicodedata.normalize('NFKC', expected))\n\n    def test_joiners_are_kept_only_inside_words(self):\n        self.assertEqual(modern('ශ්\\u200dරී ලංකාව'), 'ශ්\\u200dරී-ලංකාව')  # Sinhala ZWJ\n        self.assertEqual(modern('می\\u200cخواهم'), 'می\\u200cخواهم')  # Persian ZWNJ\n        for text in ('\\u200dabc', 'abc\\u200d', 'a \\u200d b', 'a\\u200d\\u200db', 'a\\u200d-b'):\n            with self.subTest(text=repr(text)):\n                self.assertNotIn('\\u200d', modern(text))\n\n    def test_marks_without_a_base_and_emoji_selectors_are_separators(self):\n        self.assertEqual(modern('\\u094dक'), 'क')  # Leading orphan virama.\n        self.assertEqual(modern('a \\u0301 b'), 'a-b')\n        self.assertEqual(modern('1\\ufe0f\\u20e3 go'), '1-go')  # Keycap emoji.\n\n    def test_hard_cut_does_not_end_with_a_joiner(self):\n        self.assertEqual(modern('ශ්\\u200dරී', max_length=2), 'ශ්')\n\n    def test_legacy_default_is_unchanged(self):\n        self.assertEqual(slugify('नमस्ते दुनिया', allow_unicode=True), 'नमस-त-द-न-य')\n\n    def test_custom_regex_pattern_is_unchanged(self):\n        self.assertEqual(modern('नमस्ते', regex_pattern=r'[\\W_]+'), 'नमस-त')\n\n    def test_identical_to_plain_filter_without_marks_or_joiners(self):\n        # Outside marks/joiners the filter keeps exactly str.isalnum() chars, so\n        # equivalence reduces to: [^\\W_] == isalnum for every code point. Checked\n        # in bulk, without per-character calls into traced code (PyPy + coverage).\n        everything = ''.join(chr(code) for code in range(0x110000)\n                             if not 0xD800 \u003c= code \u003c= 0xDFFF)\n        self.assertEqual(''.join(re.findall(r'[^\\W_]', everything)),\n                         ''.join(filter(str.isalnum, everything)))\n        # And the filter itself, on a sample covering every general category.\n        sample: dict = {}\n        for char in everything[::7]:\n            chars = sample.setdefault(unicodedata.category(char), [])\n            if len(chars) \u003c 40 and char not in '\\u200c\\u200d':\n                chars.append(char)\n        sample.pop('Mn', None)\n        sample.pop('Mc', None)\n        text = ''.join(char for chars in sample.values() for char in chars)\n        self.assertGreater(len(set(map(unicodedata.category, text))), 25)\n        self.assertEqual(_replace_disallowed_unicode(text), re.sub(r'[\\W_]', '-', text))\n","tests/test_modern_word_boundary.py":"import unittest\n\nfrom slugify import slugify\n\n\nclass ModernWordBoundaryTests(unittest.TestCase):\n    def test_replacement_delimiters_are_budgeted_and_preserved(self):\n        cases = (\n            ('one--two--three', '-', 13, 'one--two'),\n            ('one--two--three', '::', 17, 'one::::two'),\n            ('one---two--three', '-', 14, 'one---two'),\n            ('--one--two', '-', 8, '--one'),\n            ('--one--two', '::', 12, '::::one'),\n            ('one--two--three', '', 8, 'onetwo'),\n        )\n        for replacement, separator, limit, expected in cases:\n            for save_order in (False, True):\n                with self.subTest(replacement=replacement, separator=separator,\n                                  limit=limit, save_order=save_order):\n                    actual = slugify(\n                        'value', algorithm='modern', allow_unicode=True,\n                        replacements=[('value', replacement)],\n                        replacement_stage='post', separator=separator,\n                        max_length=limit, word_boundary=True,\n                        save_order=save_order)\n                    self.assertEqual(actual, expected)\n                    self.assertLessEqual(len(actual), limit)\n\n    def test_skipped_words_keep_the_existing_order_policy(self):\n        for separator in ('-', '::', ''):\n            with self.subTest(separator=separator):\n                actual = slugify(\n                    'oversized a b', algorithm='modern', allow_unicode=True,\n                    separator=separator, max_length=2 + len(separator),\n                    word_boundary=True)\n                self.assertEqual(actual, separator.join(('a', 'b')))\n        self.assertEqual(slugify(\n            'oversized a b', algorithm='modern', max_length=3,\n            word_boundary=True, save_order=True), 'ove')\n","tests/test_release.py":"\"\"\"Release 9 regression contracts, including real CLI execution.\"\"\"\nimport importlib\nimport itertools\nfrom pathlib import Path\nimport re\nimport subprocess\nimport sys\nimport unittest\nfrom unittest.mock import patch\n\nfrom functools import partial\n\nfrom slugify import slugify as public_slugify, smart_truncate\n\nfrom slugify.__main__ import main, parse_args, slugify_params\n\nslugify = partial(public_slugify, algorithm=\"modern\")\ncore = importlib.import_module('slugify.slugify')\n\n\nclass ReleaseRegressionTests(unittest.TestCase):\n    def test_legacy_goldens_and_differential(self):\n        from tools import legacy_reference\n        from tools.check_algorithms import check_differential, check_goldens\n        check_goldens()\n        self.assertEqual(check_differential(legacy_reference), 2688)\n\n    def test_modern_separator_does_not_strip_word_content(self):\n        for separator in ('x', 'xy', 'a', 'aa', '::', '', '-'):\n            for text in ('xylophone x', 'xy xy', 'aaa a', 'a b c'):\n                expected = separator.join(text.split())\n                for boundary in (False, True):\n                    self.assertEqual(slugify(text, separator=separator, max_length=100,\n                                             word_boundary=boundary), expected)\n                    for limit in range(1, len(expected) + 1):\n                        actual = slugify(text, separator=separator, max_length=limit,\n                                         word_boundary=boundary)\n                        self.assertLessEqual(len(actual), limit)\n        self.assertEqual(slugify('xylophone x', separator='x', max_length=1), 'x')\n        self.assertEqual(slugify('xy xy', separator='xy', max_length=5), 'xyxyx')\n        self.assertEqual(slugify('a b c', separator='::', max_length=3), 'a')\n\n    def test_modern_fitting_post_replacements_preserve_delimiters(self):\n        for replacement in ('one--two', '-one-two-', 'one---two'):\n            for separator in ('-', '::', ''):\n                expected = replacement.replace('-', separator)\n                for boundary, order, limit in itertools.product(\n                        (False, True), (False, True), (len(expected), len(expected) + 10)):\n                    with self.subTest(replacement=replacement, separator=separator,\n                                      boundary=boundary, order=order, limit=limit):\n                        self.assertEqual(slugify('x', replacements=[('x', replacement)],\n                                                 replacement_stage='post', allow_unicode=True,\n                                                 separator=separator, max_length=limit,\n                                                 word_boundary=boundary, save_order=order), expected)\n\n    def test_modern_hard_cut_does_not_end_in_post_replacement_delimiters(self):\n        cases = (\n            ('one--two', '-', 4, 'one'),\n            ('one--two', '-', 5, 'one'),\n            ('one--two', '-', 6, 'one--t'),\n            ('one--two', '::', 6, 'one'),\n            ('one--two', '::', 7, 'one'),\n            ('one--two', '::', 8, 'one::::t'),\n            ('--one', '-', 2, ''),\n            ('--one', '-', 3, '--o'),\n            ('---', '-', 2, ''),\n            ('x--two', 'x', 3, 'x'),\n            ('one--two', '', 4, 'onet'),\n        )\n        for replacement, separator, limit, expected in cases:\n            with self.subTest(replacement=replacement, separator=separator, limit=limit):\n                self.assertEqual(slugify('value', replacements=[('value', replacement)],\n                                         replacement_stage='post', allow_unicode=True,\n                                         separator=separator, max_length=limit), expected)\n\n    def test_modern_word_boundary_hard_cut_keeps_delimiters_with_the_next_word(self):\n        for order in (False, True):\n            self.assertEqual(slugify('value', replacements=[('value', '--longword')],\n                                     replacement_stage='post', allow_unicode=True,\n                                     max_length=2, word_boundary=True, save_order=order), '')\n\n    def test_cli_preserves_legacy_default_shape(self):\n        expected = dict(text='', entities=True, decimal=True, hexadecimal=True,\n                        max_length=0, word_boundary=False, save_order=False, separator='-',\n                        stopwords=None, lowercase=True, replacements=None, allow_unicode=False)\n        for argv, overrides in (([], {}), (['Hello', '--no-lowercase'], {'text': 'Hello', 'lowercase': False})):\n            with self.subTest(argv=argv):\n                params = dict(expected, **overrides)\n                args = parse_args(['slugify', *argv])\n                namespace = dict(params, stdin=False, regex_pattern=None)\n                namespace['input_string'] = namespace.pop('text')\n                self.assertEqual(vars(args), namespace)\n                self.assertEqual(slugify_params(args), params)\n        with patch('slugify.__main__.slugify', return_value='') as call, patch('builtins.print'):\n            main(['slugify'])\n            call.assert_called_once_with(**expected)\n        self.assertEqual(public_slugify('a&#39;b'), 'ab')\n\n    def test_cli_explicit_options_are_forwarded(self):\n        defaults = slugify_params(parse_args(['slugify']))\n        for flag, values in (('--algorithm', ('legacy', 'modern')),\n                             ('--backend', ('auto', 'text-unidecode', 'unidecode', 'anyascii')),\n                             ('--replacement-stage', ('both', 'pre', 'post')),\n                             ('--regex-pattern', ('', '[^a-z]+'))):\n            for value in values:\n                with self.subTest(flag=flag, value=value):\n                    key = flag[2:].replace('-', '_')\n                    args = parse_args(['slugify', flag, value])\n                    expected = dict(defaults, **{key: value})\n                    self.assertEqual(getattr(args, key), value)\n                    self.assertEqual(slugify_params(args), expected)\n                    with patch('slugify.__main__.slugify', return_value='') as call, patch('builtins.print'):\n                        main(['slugify', flag, value])\n                        call.assert_called_once_with(**expected)\n\n    def test_algorithm_cli(self):\n        for algorithm, expected in ((None, 'ab'), ('legacy', 'ab'), ('modern', 'a-b')):\n            args = ['--algorithm', algorithm] if algorithm else []\n            output = subprocess.check_output([sys.executable, '-m', 'slugify', *args, 'a&#39;b'], text=True)\n            self.assertEqual(output, expected + '\\n')\n        result = subprocess.run([sys.executable, '-m', 'slugify', '--algorithm', 'invalid', 'a'],\n                                capture_output=True, text=True)\n        self.assertEqual(result.returncode, 2)\n        self.assertIn('invalid choice', result.stderr)\n\n    def test_empty_and_whitespace(self):\n        for text in ('', ' ', '\\t\\n', '\\u2003\\u00a0', '  \\n\\t  '):\n            for unicode in (False, True):\n                with self.subTest(text=text, unicode=unicode):\n                    self.assertEqual(slugify(text, allow_unicode=unicode), '')\n\n    def test_readme_examples(self):\n        readme = (Path(__file__).resolve().parent.parent / 'README.md').read_text(encoding='utf-8')\n        for block in re.findall(r'```python\\n(.*?)```', readme, flags=re.DOTALL):\n            if block.startswith('slugify('):\n                continue  # This block documents the signature, not an invocation.\n            try:\n                exec(compile(block, 'README.md', 'exec'), {})\n            except ModuleNotFoundError as error:\n                if error.name != 'text_unidecode':\n                    raise  # The Unidecode isolation cell deliberately lacks this dependency.\n\n    def test_bytes_and_replacements(self):\n        for text in (b'caf\\xc3\\xa9\\xff', bytearray(b'caf\\xc3\\xa9\\xff')):\n            self.assertEqual(slugify(text, replacements=[('c', 'k')]), 'kafe')\n        for text in (None, 123, 1.2, [], {}, object()):\n            with self.subTest(text=type(text)), self.assertRaisesRegex(TypeError, 'text must be'):\n                slugify(text)\n\n    def test_named_and_numeric_entities_match_literal_input(self):\n        for unicode in (False, True):\n            for encoded, literal in (('&#20320;', '你'), ('&#x4F60;', '你'),\n                                     ('&beta;', 'β'), ('&#39;', \"'\"), ('&rsquo;', '’')):\n                self.assertEqual(slugify('a ' + encoded + ' b', allow_unicode=unicode),\n                                 slugify('a ' + literal + ' b', allow_unicode=unicode))\n\n    def test_invalid_entities_do_not_cancel_neighbors(self):\n        for unicode, letter in ((False, 'z'), (True, 'ž')):\n            for invalid, expected in (('&#99999999999999999999;', '99999999999999999999'),\n                                      ('&#x110000;', 'x110000'), ('&#55296;', '55296'),\n                                      ('&#xDFFF;', 'xdfff')):\n                self.assertEqual(slugify('&#381; ' + invalid + ' &#x17D;', allow_unicode=unicode),\n                                 f'{letter}-{expected}-{letter}')\n        # Exceeds Python's optional integer-string digit limit on newer runtimes.\n        huge = '9' * 5000\n        self.assertEqual(slugify('&#65; &#' + huge + '; &#66;'), 'a-' + huge + '-b')\n\n    def test_entity_flags_are_independent(self):\n        text = '&beta; &#65; &#x42;'\n        self.assertEqual(slugify(text, entities=False, decimal=False, hexadecimal=False), 'beta-65-x42')\n        self.assertEqual(slugify(text, entities=False, decimal=True, hexadecimal=False), 'beta-a-x42')\n        self.assertEqual(slugify(text, entities=False, decimal=False, hexadecimal=True), 'beta-65-b')\n\n    def test_normalization_ordinals_dashes_and_phonetic_quotes(self):\n        self.assertEqual(slugify('1º 1ª 𝐚́́𝕒́'), '1o-1a-aa')\n        self.assertEqual(slugify('a‐b‑c‒d–e—f'), 'a-b-c-d-e-f')\n        self.assertEqual(slugify('ㅋ', allow_unicode=True), 'ᄏ')\n        self.assertEqual(slugify(\"Baby's shoes\"), 'baby-s-shoes')\n        self.assertEqual(slugify('Baby’s shoes'), 'babys-shoes')\n        self.assertEqual(slugify('Компьютер'), 'kompiuter')\n\n    def test_replacement_stages_and_iterables(self):\n        for stage, expected in (('both', 'aaaa'), ('pre', 'aa'), ('post', 'aa')):\n            for rules in ([('a', 'aa')], iter([('a', 'aa')]), iter([iter(('a', 'aa'))])):\n                self.assertEqual(slugify('a', replacements=rules, replacement_stage=stage), expected)\n        self.assertEqual(slugify('a', replacements=[('a', 'b'), ('b', 'c')], replacement_stage='pre'), 'c')\n        self.assertEqual(slugify('a', replacements=[('a', '!')], replacement_stage='post'), '!')\n        self.assertEqual(slugify('a', replacements=[('a', '!')], replacement_stage='pre'), '')\n        self.assertEqual(slugify('a', replacements=[('a', 'aaaa')], replacement_stage='post', max_length=2), 'aa')\n        self.assertEqual(slugify('a', replacements=[('', 'x')], replacement_stage='pre'), 'xax')\n        with self.assertRaises(ValueError):\n            slugify('a', replacements=[('a', 'b', 'c')])\n        with self.assertRaisesRegex(ValueError, 'replacement_stage'):\n            slugify('a', replacement_stage='invalid')\n\n    def test_stopword_iterators_case_sensitive_and_normalized(self):\n        for lowercase, expected in ((True, 'b'), (False, 'a_B')):\n            self.assertEqual(slugify('A a B', lowercase=lowercase, stopwords=iter(['A']), separator='_'),\n                             expected)\n        self.assertEqual(slugify('café b', stopwords=iter(['cafe'])), 'b')\n        self.assertEqual(slugify('A a B', lowercase=False, stopwords=iter(['A'])), 'a-B')\n\n    def test_actual_separator_width_and_literal_characters(self):\n        self.assertEqual(slugify('a b c', separator='---', max_length=5), 'a---b')\n        self.assertEqual(slugify('a b c', separator='---', max_length=3), 'a')\n        self.assertEqual(slugify('a b c', separator='', max_length=2, word_boundary=True), 'ab')\n        for separator in ('\\\\', r'\\1', '[x]', '.*', '::', '---'):\n            self.assertEqual(slugify('a b', separator=separator), 'a' + separator + 'b')\n        # Legacy mapping intentionally still changes allowed literal dashes.\n        self.assertEqual(slugify('a-b c', separator='_', regex_pattern=r'[^-a-z]+'), 'a_b_c')\n\n    def test_empty_separator_preserves_word_boundaries(self):\n        for order in (False, True):\n            self.assertEqual(slugify('hello world', max_length=8, word_boundary=True,\n                                    separator='', save_order=order), 'hello')\n        self.assertEqual(slugify('oversized hi all', max_length=5, word_boundary=True,\n                                separator=''), 'hiall')\n        self.assertEqual(slugify('oversized hi all', max_length=5, word_boundary=True,\n                                separator='', save_order=True), 'overs')\n        self.assertEqual(slugify('a b', max_length=5, word_boundary=True, separator=''), 'ab')\n        self.assertEqual(slugify('', max_length=5, word_boundary=True, separator=''), '')\n\n    def test_truncate_contracts(self):\n        self.assertEqual(smart_truncate(':alpha:', 0, separator='::'), 'alpha')\n        self.assertEqual(smart_truncate('abcdef', -1), 'abcde')\n        with self.assertRaises(ValueError):\n            smart_truncate('abc', 2, True, '')\n        self.assertEqual(smart_truncate('oversized a b', 3, True), 'a b')\n        self.assertEqual(smart_truncate('oversized a b', 3, True, save_order=True), 'ove')\n\n    def test_bounded_length_and_default_idempotence(self):\n        corpus = ('', 'a b c', '影師嗎', 'A a B', \"a's café\", '1º—2ª', 'a___b', '&#65; &#x110000;')\n        for text, separator, boundary, order, limit in itertools.product(\n                corpus, ('-', '', '::', r'\\1', 'aaa'), (False, True), (False, True), range(1, 12)):\n            result = slugify(text, separator=separator, word_boundary=boundary, save_order=order, max_length=limit)\n            self.assertLessEqual(len(result), limit)\n        for text in corpus:\n            result = slugify(text)\n            self.assertEqual(slugify(result), result)\n\n    def test_backend_selection_and_no_fallback_on_broken_install(self):\n        with patch.object(core, 'import_module') as load:\n            load.return_value.unidecode.return_value = 'chosen'\n            self.assertEqual(slugify('é'), 'chosen')\n            load.assert_called_once_with('unidecode')\n        with patch.object(core, 'import_module', side_effect=ModuleNotFoundError(name='dependency')):\n            with self.assertRaises(ModuleNotFoundError) as error:\n                slugify('é')\n            self.assertEqual(error.exception.name, 'dependency')\n        with patch.object(core, 'import_module', side_effect=ModuleNotFoundError(name='anyascii')):\n            with self.assertRaises(ModuleNotFoundError):\n                slugify('é', backend='anyascii')\n        with patch.object(core, 'import_module', side_effect=AssertionError('must not import')):\n            self.assertEqual(slugify('影師嗎', allow_unicode=True, backend='anyascii'), '影師嗎')\n        with self.assertRaisesRegex(ValueError, 'backend'):\n            slugify('x', backend='invalid')\n\n    def test_ascii_input_skips_backend_import(self):\n        legacy = importlib.import_module('slugify._legacy')\n        for module, call in ((core, slugify), (legacy, public_slugify)):\n            with self.subTest(module=module.__name__):\n                with patch.object(module, 'import_module', side_effect=AssertionError('must not import')):\n                    self.assertEqual(call('Living Room &amp; Kitchen 2'), 'living-room-kitchen-2')\n        # ASCII identity holds across every backend incl. auto; invalid names still rejected.\n        for backend in ('auto', 'text-unidecode', 'unidecode', 'anyascii'):\n            with self.subTest(backend=backend):\n                try:\n                    importlib.import_module('unidecode' if backend == 'auto'\n                                            else backend.replace('-', '_'))\n                except ModuleNotFoundError:\n                    self.skipTest(f'{backend} backend absent')\n                with patch.object(core, 'import_module', side_effect=AssertionError('must not import')):\n                    self.assertEqual(slugify('Living Room Light 123', backend=backend),  # type: ignore[arg-type]\n                                     'living-room-light-123')\n                with patch.object(legacy, 'import_module', side_effect=AssertionError('must not import')):\n                    self.assertEqual(public_slugify('Living Room Light 123', backend=backend),  # type: ignore[arg-type]\n                                     'living-room-light-123')\n        for algorithm in ('legacy', 'modern'):\n            with self.subTest(algorithm=algorithm):\n                with self.assertRaisesRegex(ValueError, 'backend'):\n                    public_slugify('x', backend='invalid', algorithm=algorithm)  # type: ignore[arg-type]\n        # Non-ASCII still reaches the backend (no silent skip).\n        for backend in ('text-unidecode', 'unidecode', 'anyascii'):\n            with self.subTest(backend=backend, non_ascii=True):\n                try:\n                    importlib.import_module(backend.replace('-', '_'))\n                except ModuleNotFoundError:\n                    self.skipTest(f'{backend} backend absent')\n                self.assertEqual(slugify('café', backend=backend), 'cafe')  # type: ignore[arg-type]\n\n    def test_auto_falls_back_only_when_unidecode_missing(self):\n        original = core.import_module\n\n        def load(name):\n            if name == 'unidecode':\n                raise ModuleNotFoundError(name=name)\n            return original(name)\n\n        try:\n            original('text_unidecode')\n        except ModuleNotFoundError:\n            self.skipTest('text-unidecode absent in isolated backend environment')\n        with patch.object(core, 'import_module', side_effect=load):\n            self.assertEqual(slugify('影師嗎'), 'ying-shi-ma')\n\n    def test_explicit_backend_golden_corpus(self):\n        corpus = ['影師嗎', 'Компьютер', 'β', 'café', '1º 1ª', '你']\n        expected = {\n            'text-unidecode': ['ying-shi-ma', 'kompiuter', 'b', 'cafe', '1o-1a', 'ni'],\n            'unidecode': ['ying-shi-ma', 'kompiuter', 'b', 'cafe', '1o-1a', 'ni'],\n            'anyascii': ['yingshima', 'kompyuter', 'v', 'cafe', '1o-1a', 'ni'],\n        }\n        for backend, values in expected.items():\n            try:\n                importlib.import_module(backend.replace('-', '_'))\n            except ModuleNotFoundError:\n                continue\n            with self.subTest(backend=backend):\n                self.assertEqual([slugify(text, backend=backend) for text in corpus], values)\n\n    def test_cli_forwarding_and_real_module(self):\n        argv = ['slugify', '--regex-pattern', '[^-a-z0-9_]+', '--backend', 'auto',\n                '--replacement-stage', 'pre', '___This is a test___']\n        params = slugify_params(parse_args(argv))\n        self.assertEqual(params['regex_pattern'], '[^-a-z0-9_]+')\n        self.assertEqual(params['backend'], 'auto')\n        self.assertEqual(params['replacement_stage'], 'pre')\n        result = subprocess.run([sys.executable, '-m', 'slugify', *argv[1:]],\n                                check=True, capture_output=True, text=True)\n        self.assertEqual(result.stdout, '___this-is-a-test___\\n')\n        result = subprocess.run([sys.executable, '-m', 'slugify', '--stdin'], input='Café',\n                                check=True, capture_output=True, text=True)\n        self.assertEqual(result.stdout, 'cafe\\n')\n        with patch('builtins.print') as output:\n            main(argv)\n            output.assert_called_once_with('___this-is-a-test___')\n        with patch.object(sys, 'argv', ['slugify', 'Hello']), patch('builtins.print') as output:\n            main()\n            output.assert_called_once_with('hello')\n        with patch('slugify.__main__.slugify', side_effect=KeyboardInterrupt), self.assertRaises(SystemExit):\n            main(['slugify'])\n\n\nif __name__ == '__main__':\n    unittest.main()\n\n\nclass UppercaseHexReferenceTests(unittest.TestCase):\n    def test_modern_accepts_both_hexadecimal_prefixes(self):\n        for prefix in ('x', 'X'):\n            with self.subTest(prefix=prefix):\n                self.assertEqual(slugify(f'&#{prefix}41; &#{prefix}e9;', allow_unicode=True), 'a-é')\n                self.assertEqual(slugify(f'&#{prefix}41;', lowercase=False), 'A')\n\n    def test_hexadecimal_opt_out_preserves_reference_filtering(self):\n        self.assertEqual(slugify('&#X41;', hexadecimal=False), 'x41')\n\n    def test_legacy_uppercase_reference_output_is_unchanged(self):\n        self.assertEqual(public_slugify('&#X41;'), 'x41')\n        self.assertEqual(public_slugify('&#X41;', algorithm='legacy'), 'x41')\n\n    def test_invalid_uppercase_reference_does_not_block_valid_neighbor(self):\n        self.assertEqual(slugify('&#X110000; &#X41;'), 'x110000-a')\n        self.assertEqual(slugify('&#XD800; &#X41;'), 'xd800-a')\n\n    def test_uppercase_reference_through_cli(self):\n        output = subprocess.check_output(\n            [sys.executable, '-m', 'slugify', '--algorithm', 'modern', '&#X41;'], text=True)\n        self.assertEqual(output, 'a\\n')\n\n\nclass ModernArgumentValidationTests(unittest.TestCase):\n    def test_modern_rejects_bool_and_non_int_max_length(self):\n        with self.assertRaises(TypeError):\n            slugify('Hello World', max_length=True)\n        with self.assertRaises(TypeError):\n            slugify('Hello World', max_length=1.5)\n\n    def test_modern_rejects_non_str_separator(self):\n        with self.assertRaises(TypeError):\n            slugify('Hello World', separator=None)\n\n    def test_modern_accepts_valid_int_max_length(self):\n        self.assertEqual(slugify('Hello World', max_length=5), 'hello')\n\n    def test_legacy_argument_behavior_is_frozen(self):\n        # Legacy must not gain the modern validation: bool max_length is an int\n        # subclass and historically truncates to one character.\n        self.assertEqual(public_slugify('Hello World', max_length=True), 'h')\n        self.assertEqual(public_slugify('Hello World', algorithm='legacy', max_length=True), 'h')\n\n\nclass SplitCoverageTests(unittest.TestCase):\n    \"\"\"Exercise reachable branches in both split modules via the public API.\n\n    These assert existing behavior only; they do not change legacy output.\n    \"\"\"\n\n    def test_legacy_bytes_and_bytearray_input(self):\n        self.assertEqual(public_slugify(b'Hello World'), 'hello-world')\n        self.assertEqual(public_slugify(bytearray(b'Caf\\xc3\\xa9')), 'cafe')\n\n    def test_legacy_rejects_invalid_replacement_stage_and_backend(self):\n        with self.assertRaises(ValueError):\n            public_slugify('x', replacement_stage='nope')  # type: ignore[arg-type]\n        with self.assertRaises(ValueError):\n            public_slugify('x', backend='nope')  # type: ignore[arg-type]\n\n    def test_legacy_word_boundary_hard_cut_without_separator(self):\n        # No separator present forces the string[:max_length] branch.\n        self.assertEqual(public_slugify('abcdef', max_length=3, word_boundary=True), 'abc')\n\n    def test_legacy_auto_backend_matches_default(self):\n        self.assertEqual(public_slugify('影師嗎', backend='auto'),\n                         public_slugify('影師嗎'))\n\n    def test_modern_auto_backend_and_truncation_branches(self):\n        self.assertEqual(slugify('影師嗎', backend='auto'), 'ying-shi-ma')\n        # Hard-cut branch: a single long token trimmed below its length.\n        self.assertEqual(slugify('abcdef', max_length=3), 'abc')\n        # Empty leading token path with an explicit separator.\n        self.assertEqual(slugify('a b', separator='_', max_length=3), 'a_b')\n\n    def test_modern_word_boundary_empty_token(self):\n        # word_boundary truncation over tokens that include an empty segment.\n        self.assertEqual(\n            slugify('a--b c', word_boundary=True, max_length=3), 'a-b')\n","tools/check_algorithms.py":"\"\"\"Reusable API compatibility checks, also run against installed release artifacts.\"\"\"\nimport inspect\nimport itertools\n\nfrom slugify import slugify, smart_truncate\n\n\ndef check_goldens():\n    cases = (\n        ('a&#39;b', {}, 'ab', 'a-b'),\n        ('a&eacute;b', {}, 'ae-b', 'aeb'),\n        ('a&#20320;b', {}, 'a-b', 'ani-b'),\n        ('xylophone x', {'separator': 'x', 'max_length': 100}, 'xylophonexx', 'xylophonexx'),\n        ('a b c', {'separator': '::', 'max_length': 3}, 'a::b', 'a'),\n    )\n    for text, options, legacy, modern in cases:\n        assert slugify(text, **options) == legacy\n        assert slugify(text, algorithm='legacy', **options) == legacy\n        assert slugify(text, algorithm='modern', **options) == modern\n    for algorithm, expected in (('legacy', 'aa'), ('modern', 'aaaa')):\n        assert slugify('a', replacements=iter([('a', 'aa')]), algorithm=algorithm) == expected\n    for algorithm, expected in (('legacy', 'a-b-a-b'), ('modern', 'a-a')):\n        assert slugify('a b a b', stopwords=iter(['A', 'b']), lowercase=False, algorithm=algorithm) == expected\n    parameter = inspect.signature(slugify).parameters['algorithm']\n    assert parameter.kind == inspect.Parameter.KEYWORD_ONLY and parameter.default == 'legacy'\n    try:\n        slugify('a', algorithm='invalid')\n    except ValueError:\n        pass\n    else:\n        raise AssertionError('unknown algorithm accepted')\n\n\ndef check_differential(reference):\n    corpus = ('', 'a b c', 'xylophone x', \"Baby's café\", 'a&eacute;b', 'a&#39;b', 'a&#20320;b',\n              '&#65; &#99999999999999999999; &#66;', '&#x41; &#x110000; &#x42;',\n              '&#55296;', '&#xDFFF;', '影師嗎', 'A a B', '1,234—5')\n    count = 0\n    for text, separator, limit, boundary, order, unicode in itertools.product(\n            corpus, ('-', '', '::', 'x'), (0, -1, 1, 3, 8, 100), (False, True), (False, True), (False, True)):\n        options = dict(separator=separator, max_length=limit, word_boundary=boundary,\n                       save_order=order, allow_unicode=unicode)\n        expected = reference.slugify(text, **options)\n        assert slugify(text, **options) == expected, (text, options)\n        assert slugify(text, algorithm='legacy', **options) == expected, (text, options)\n        count += 1\n    # Each call receives fresh iterators; using the same consumed object hides regressions.\n    for replacements in (lambda: [('a', 'aa')], lambda: iter([('a', 'aa')]),\n                         lambda: iter([iter(('a', 'aa'))])):\n        assert slugify('a', replacements=replacements()) == reference.slugify('a', replacements=replacements())\n    for lowercase in (False, True):\n        assert slugify('a b a b', lowercase=lowercase, stopwords=iter(['A', 'b'])) == reference.slugify(\n            'a b a b', lowercase=lowercase, stopwords=iter(['A', 'b']))\n    for text, separator, limit, boundary, order in itertools.product(\n            ('::alpha::', 'a b c', 'abcdef', ''), (' ', '::', '', 'x'), (0, -2, 1, 5), (False, True), (False, True)):\n        args = (text, limit, boundary, separator, order)\n        try:\n            expected = reference.smart_truncate(*args)\n        except ValueError:\n            try:\n                smart_truncate(*args)\n            except ValueError:\n                continue\n            raise AssertionError(('missing legacy ValueError', args))\n        assert smart_truncate(*args) == expected, args\n    return count\n\n\nif __name__ == '__main__':\n    check_goldens()\n    print('PASS: installed algorithm API goldens')\n","tools/check_dist.py":"\"\"\"Build, inspect and install both artifacts without publishing or using checkout imports.\"\"\"\nimport argparse\nimport email\nimport os\nfrom pathlib import Path\nimport subprocess\nimport sys\nimport tarfile\nimport tempfile\nimport venv\nimport zipfile\n\n\nROOT = Path(__file__).resolve().pare and sdist validation; no upload or tag operations performed')\n\n\nif __name__ == '__main__':\n    main()\n","tools/legacy_reference.py":"\"\"\"Frozen compatibility oracle from 7b6d5d9; do not modernize this fixture.\"\"\"\nfrom __future__ import annotations\n\nimport re\nimport unicodedata\nfrom collections.abc import Iterable\nfrom html.entities import name2codepoint\n\ntry:\n    import unidecode\nexcept ImportError:\n    import text_unidecode as unidecode  # type: ignore[import-untyped, no-redef]\n\n__all__ = ['slugify', 'smart_truncate']\n\n\nCHAR_ENTITY_PATTERN = re.compile(r'&(%s);' % '|'.join(name2codepoint))\nDECIMAL_PATTERN = re.compile(r'&#(\\d+);')\nHEX_PATTERN = re.compile(r'&#x([\\da-fA-F]+);')\nQUOTE_PATTERN = re.compile(r'[\\']+')\nDISALLOWED_CHARS_PATTERN = re.compile(r'[^-a-zA-Z0-9]+')\nDISALLOWED_UNICODE_CHARS_PATTERN = re.compile(r'[\\W_]+')\nDUPLICATE_DASH_PATTERN = re.compile(r'-{2,}')\nNUMBERS_PATTERN = re.compile(r'(?\u003c=\\d),(?=\\d)')\nDEFAULT_SEPARATOR = '-'\n\n\ndef smart_truncate(\n    string: str,\n    max_length: int = 0,\n    word_boundary: bool = False,\n    separator: str = \" \",\n    save_order: bool = False,\n) -> str:\n    \"\"\"\n    Truncate a string.\n    :param string (str): string for modification\n    :param max_length (int): output string length\n    :param word_boundary (bool):\n    :param save_order (bool): if True then word order of output string is like input string\n    :param separator (str): separator between words\n    :return:\n    \"\"\"\n\n    string = string.strip(separator)\n\n    if not max_length:\n        return string\n\n    if len(string) \u003c max_length:\n        return string\n\n    if not word_boundary:\n        return string[:max_length].strip(separator)\n\n    if separator not in string:\n        return string[:max_length]\n\n    truncated = ''\n    for word in string.split(separator):\n        if word:\n            next_len = len(truncated) + len(word)\n            if next_len \u003c max_length:  for(const edge of edges){const id=direction==='out'?edge.to:edge.from,key=id+'|'+edge.kind;if(!unique.has(key))unique.set(key,{n:nodes.get(id),kind:edge.kind,sites:new Map()});const owner=nodes.get(edge.from);unique.get(key).sites.set(owner.path+':'+edge.line,{owner,line:edge.line});}
 for(const {n,kind,sites} of unique.values()){
  panel.append(row(n,`${names[kind]} · ${direction==='in'?'source':'target'}: ${n.path.split('/').slice(-2).join('/')}`));
  const evidence=make('details');evidence.append(make('summary',`Source evidence · ${sites.size} site${sites.size===1?'':'s'}`));
  for(const {owner,line} of sites.values()){const p=make('p',null,'path'),url=sourceLink(owner,line);const a=make(url?'a':'span',`${owner.path} · L${line}`);if(url){a.href=url;a.target='_blank';a.rel='noopener noreferrer';}p.append(a);evidence.append(p);}panel.append(evidence);
 }
}
function select(n){
 selected=n;breadcrumb(n);panelHeader(label(n),n.kind==='method'?[n.language,n.ownerName].filter(Boolean).join(' · '):n.kind==='file'?`${n.language} file`:'Folder');
 panel.dataset.node=n.id;panel.dataset.kind=n.kind;if(n.subtitle)panel.append(make('p',n.subtitle,'subtitle'));panel.append(make('p',n.path||data.title,'path'));
 const zoomButton=make('button','Zoom to '+(n.kind==='method'?'method':n.kind));zoomButton.onclick=()=>fit(n);panel.append(zoomButton);
 if(n.summary)panel.append(make('p',n.summary));
 if(n.signature){const signature=make('details');signature.append(make('summary','Signature'),make('pre',n.signature));panel.append(signature);}
 if(n.kind!=='folder'){const url=sourceLink(n);if(url){const a=make('a',`Open source · ${data.repository.revision.slice(0,7)}${n.line?' · L'+n.line:''}`);a.href=url;a.target='_blank';a.rel='noopener noreferrer';const p=make('p');p.append(a);panel.append(p);}}
 if(n.kind==='method'){
  const fitLinks=make('button','Fit connections');fitLinks.onclick=()=>{const related=[...neighborhood().ids].map(id=>nodes.get(id));const x=Math.min(...related.map(n=>n.x)),y=Math.min(...related.map(n=>n.y));if(matchMedia('(max-width:760px)').matches)closePanel();fit({x,y,w:Math.max(...related.map(n=>n.x+n.w))-x,h:Math.max(...related.map(n=>n.y+n.h))-y});};panel.append(fitLinks);
  connectionRows('Outgoing static links',outgoing.get(n.id)||[],'out');connectionRows('Incoming static links',incoming.get(n.id)||[],'in');
  const unresolved=(n.calls||[]).filter(call=>!call.target);if(unresolved.length){const details=make('details');details.append(make('summary',`External or unresolved call sites · ${unresolved.length}`));for(const call of unresolved){details.append(make('pre',`L${call.line}  ${call.text}\n${call.unresolved}`));}panel.append(details);}
  const source=data.sources[n.path];if(source){const details=make('details');details.append(make('summary',`Method source · lines ${n.line}–${n.endLine}`));const lines=source.split('\n').slice(n.line-1,n.endLine);details.append(make('pre',lines.map((line,i)=>`${n.line+i}  ${line}`).join('\n')));panel.append(details);}
 }else{
  const items=n.kind==='folder'?children(n):n.children;panel.append(make('h3',`${n.kind==='file'?'Methods and constructors':'Contents'} · ${items.length}`));
  if(n.kind==='file'){
   panel.append(make('p','Grouped by declared class. Call chains read left to right; cycles stay together. Methods without known links inside their class follow source order.'));
   for(const section of n.sections){panel.append(make('h3',section.owner));for(const block of section.blocks){panel.append(make('p',block.label,'group-label'));for(const id of block.ids){const m=nodes.get(id);panel.append(row(m,`${m.ownerName} · L${m.line}`));}}}
  }else for(const child of items)panel.append(row(child,child.kind));
  if(n.kind==='file'){
   for(const cls of n.classes||[]){const detail=make('details');detail.append(make('summary',cls.name.split('.').slice(-2).join('.')+' · '+cls.fields.length+' fields'));if(cls.supers.length)detail.append(make('p','Extends / implements: '+cls.supers.join(', ')));for(const field of cls.fields)detail.append(make('pre',`${field.type} ${field.name} · L${field.line}`));panel.append(detail);}
   const out=data.edges.filter(e=>nodes.get(e.from)?.path===n.path&&nodes.get(e.to)?.path!==n.path),inc=data.edges.filter(e=>nodes.get(e.to)?.path===n.path&&nodes.get(e.from)?.path!==n.path);
   connectionRows('Links from this file',out,'out');connectionRows('Links into this file',inc,'in');
  }
 }
 status.textContent=`${label(n)}${n.line?' · L'+n.line:''} · ${n.category} · static source index, not a runtime trace`;
 requestDraw();
}
function coverage(){panelHeader('Source coverage','Repository index');panel.append(make('p',`${c.files} tracked files; ${c.javaFiles} Java files and ${c.pythonFiles} Python files parsed. ${c.methods} methods, constructors and functions.`));panel.append(make('p',`${c.resolvedCalls} of ${c.callSites} call sites have conservative local links. ${c.unresolvedCalls} external or unresolved sites remain visible in method details. ${c.imports} local import links.`));panel.append(make('p','Revision '+data.repository.revision,'path'));const ul=make('ul');for(const limit of data.limitations)ul.append(make('li',limit));panel.append(ul);panel.append(make('h3','Browse the entire project'));for(const node of root.children)panel.append(row(node,node.category));}
document.getElementById('coverage').onclick=coverage;
document.getElementById('fit').onclick=()=>{selected=null;closePanel();fit(root);breadcrumb(root);status.textContent=defaultStatus;};
document.getElementById('in').onclick=()=>zoom(1.5);document.getElementById('out').onclick=()=>zoom(1/1.5);
function up(){const current=selected||hit(width/2,height/2);const parent=nodes.get(current.parent)||root;selected=parent;fit(parent);breadcrumb(parent);}
document.getElementById('parent').onclick=up;
document.getElementById('edges').onchange=e=>{edgeMode=e.target.value;requestDraw();};
search.addEventListener('input',()=>{const q=search.value.trim().toLowerCase();results.replaceChildren();results.hidden=!q;search.setAttribute('aria-expanded',String(!!q));if(!q)return;const matches=[...nodes.values()].filter(n=>n!==root&&(n.path+' '+n.label+' '+(n.ownerName||'')).toLowerCase().includes(q));matches.sort((a,b)=>(a.label.toLowerCase().startsWith(q)?-1:0)-(b.label.toLowerCase().startsWith(q)?-1:0)||a.path.localeCompare(b.path));for(const n of matches.slice(0,60)){const b=make('button',label(n));b.append(make('small',`${n.subtitle?n.subtitle+' · ':''}${n.kind} · ${n.path}${n.line?' · L'+n.line:''}`));b.onclick=()=>{results.hidden=true;search.setAttribute('aria-expanded','false');select(n);fit(n);};results.append(b);}if(!matches.length)results.append(make('p','No matching file or method.'));if(matches.length>60)results.append(make('p',`${matches.length} matches. Refine your search to see the rest.`));});
search.addEventListener('keydown',event=>{if(event.key==='Escape'){results.hidden=true;search.blur();}if(event.key==='ArrowDown'){event.preventDefault();results.querySelector('button')?.focus();}if(event.key==='Enter'){results.querySelector('button')?.click();}});
document.addEventListener('pointerdown',event=>{if(!document.getElementById('search-wrap').contains(event.target)){results.hidden=true;search.setAttribute('aria-expanded','false');}});
document.addEventListener('keydown',event=>{if(event.target.matches('input,textarea,select'))return;if(event.key==='/'){event.preventDefault();search.focus();return;}if(event.key==='Escape'){clearSelection();return;}if(event.target!==canvas)return;if(['+','=','-','0','ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Enter','Backspace'].includes(event.key))event.preventDefault();if(event.key==='+'||event.key==='=')zoom(1.4);if(event.key==='-')zoom(1/1.4);if(event.key==='0')fit(root);if(event.key==='Enter')fit(selected||hit(width/2,height/2));if(event.key==='Backspace')up();if(event.key==='ArrowLeft')target.x+=80;if(event.key==='ArrowRight')target.x-=80;if(event.key==='ArrowUp')target.y+=80;if(event.key==='ArrowDown')target.y-=80;requestDraw();});
const tour=document.getElementById('tour');for(const [i,flow] of data.flows.entries()){const option=make('option',flow.name);option.value=String(i);tour.append(option);}
tour.onchange=()=>{if(tour.value==='')return;const flow=data.flows[Number(tour.value)];panelHeader(flow.name,'Source-backed walkthrough');panel.append(make('p','Steps describe control flow; callbacks and inherited hooks may not appear as direct static edges.'));flow.steps.forEach((step,i)=>{const n=nodes.get(step.node);const b=row(n,`${i+1}. ${step.note} · L${step.line}`);panel.append(b);});const first=nodes.get(flow.steps[0]?.node);if(first){selected=first;fit(nodes.get(first.parent)||first);breadcrumb(first);}};
const defaultStatus=`All ${c.files} tracked files · ${data.repository.revision.slice(0,7)} · solid: static call candidates · dashed: imports / references`;
status.textContent=defaultStatus;
function resize(){const w=stage.clientWidth,h=stage.clientHeight;if(!w||!h)return;const before={x:width/2,y:height/2};width=w;height=h;const dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);if(!initialized){initialized=true;fit(root,true);const p=new URLSearchParams(location.hash.slice(1));const k=Number(p.get('z')),x=Number(p.get('x')),y=Number(p.get('y'));if(p.get('layout')==='calls-v3'&&p.has('z')&&k>0&&Number.isFinite(k+x+y)){target={k:clamp(k,minimum(),5),x,y};camera={...target};}const id=p.get('node');if(nodes.has(id)){selected=nodes.get(id);if(p.get('layout')!=='calls-v3')fit(selected,true);breadcrumb(selected);}else breadcrumb(root);}else{target.x+=w/2-before.x;target.y+=h/2-before.y;camera.x+=w/2-before.x;camera.y+=h/2-before.y;}const nav=document.getElementById('breadcrumbs');nav.scrollLeft=nav.scrollWidth;requestDraw();}
new ResizeObserver(resize).observe(stage);applyTheme();resize();
})();
</script>
