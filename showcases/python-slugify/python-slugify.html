<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Repository explorer</title>
<style>
:root{color-scheme:dark;--bg:#020617;--canvas:#080d1c;--dot:#243044;--surface:#0f172a;--raised:#1b2940;--ink:#f1f5f9;--muted:#a1afc2;--line:#283449;--accent:#34d399;--field:#0b1222;--folder:#d3af63;--file:#70bdd2;--method:#60c9a8;--space:24px}
:root[data-theme=light]{color-scheme:light;--bg:#f4f5f7;--canvas:#fff;--dot:#e2e7ec;--surface:#fff;--raised:#edf2f6;--ink:#111827;--muted:#536174;--line:#d9e0e8;--accent:#047857;--field:#f8fafc;--folder:#926119;--file:#14758b;--method:#168065}
*{box-sizing:border-box;scrollbar-color:var(--line) var(--surface);scrollbar-width:thin}
html,body{width:100%;height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,sans-serif}
button,input,select{font:inherit;color:inherit}
button,select{background:var(--surface);border:1px solid var(--line);border-radius:8px;min-height:40px;padding:8px 12px;cursor:pointer}
button:hover,select:hover{background:var(--raised);border-color:var(--muted)}
button:active{background:var(--raised)}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,canvas:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
button[aria-pressed=true]{background:var(--accent);color:var(--bg);border-color:var(--accent)}
input{width:100%;min-height:44px;border:1px solid var(--line);border-radius:8px;background:var(--field);padding:10px 14px;caret-color:var(--accent)}
input::placeholder{color:var(--muted);opacity:1}
::selection{background:var(--accent);color:var(--bg)}
a{color:var(--accent);text-underline-offset:4px}
header{flex:none;padding:22px var(--space) 0;display:grid;grid-template-columns:minmax(190px,1fr) minmax(210px,340px) auto;gap:16px 24px;align-items:center;background:var(--bg)}
header>div:first-child{min-width:0}
h1{font-size:20px;line-height:1.35;letter-spacing:-.02em;margin:0;overflow-wrap:anywhere}
#counts{font-size:12px;color:var(--muted);margin-top:6px;font-variant-numeric:tabular-nums}
#search-wrap{position:relative;min-width:0}
#results{position:absolute;top:calc(100% + 8px);left:0;right:0;max-height:52vh;overflow:auto;background:var(--surface);border-radius:12px;z-index:5;box-shadow:0 8px 32px #0004;padding:6px}
#results[hidden]{display:none}
#results button{display:block;text-align:left;width:100%;border:0;border-radius:6px;padding:12px;overflow-wrap:anywhere}
#results small{display:block;color:var(--muted);font-size:12px;margin-top:4px;line-height:1.5}
#results p{padding:12px;margin:0;color:var(--muted)}
.actions{display:flex;align-items:center;gap:4px;min-width:0;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.actions button,.actions select{border-color:transparent;background:transparent;padding-inline:10px}
.actions button:hover,.actions select:hover{background:var(--raised)}
#context{grid-column:1/-1;display:flex;align-items:center;gap:20px;min-width:0;padding:10px 0 0}
.breadcrumb{display:flex;gap:0;overflow-x:auto;align-items:center;flex:1;min-width:0;white-space:nowrap;scrollbar-width:none}
.breadcrumb button{flex:none;min-height:32px;border:0;background:transparent;font-size:12px;max-width:210px;overflow:hidden;text-overflow:ellipsis;padding:4px 8px;color:var(--muted)}
.breadcrumb button+button::before{content:'/';display:inline-block;margin-right:16px;color:var(--muted)}
.breadcrumb button:first-child{padding-left:0}
.breadcrumb button:last-child{color:var(--ink);font-weight:600}
#level{font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
#edges{font-size:12px;flex:none}
#workspace{flex:1;position:relative;min-height:0;display:flex;gap:16px;padding:16px var(--space);overflow:hidden}
#stage{flex:1;min-width:0;min-height:0;position:relative;overflow:hidden;background-color:var(--canvas);background-image:radial-gradient(var(--dot) .75px,transparent .75px);background-size:24px 24px;border:1px solid var(--line);border-radius:16px}
canvas{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
canvas.dragging{cursor:grabbing}
.canvas-controls{position:absolute;bottom:20px;left:20px;display:flex;gap:4px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.canvas-controls button{border-color:transparent;min-width:40px;font-size:18px}
.canvas-controls #fit{font-size:12px;min-width:80px}
#hint{position:absolute;bottom:30px;right:24px;max-width:calc(100% - 310px);text-align:right;color:var(--muted);font-size:12px;pointer-events:none;background:var(--canvas);padding:2px 0}
#inspector{width:368px;max-width:40vw;flex:none;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:auto;padding:var(--space);overscroll-behavior:contain}
#inspector[hidden]{display:none}
#inspector .heading{display:flex;justify-content:space-between;gap:16px;align-items:start;margin-bottom:20px}
#inspector .heading>div{min-width:0}
#inspector .heading button{flex:none}
#inspector h2{margin:0 0 8px;font-size:20px;line-height:1.35;overflow-wrap:anywhere}
#inspector[data-kind=method] h2{font:600 17px/1.5 ui-monospace,SFMono-Regular,monospace}
#inspector h3{font-size:14px;margin:32px 0 12px;line-height:1.5}
#inspector p{color:var(--muted);margin:12px 0 16px;overflow-wrap:anywhere}
#inspector .path{font-size:12px;overflow-wrap:anywhere;line-height:1.7}
#inspector .type{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
#inspector .subtitle{font-size:15px;color:var(--ink)}
#inspector .group-label{margin:24px 0 8px;font-size:12px;font-weight:600;color:var(--ink)}
#inspector .row{width:100%;display:block;text-align:left;margin:0;padding:12px 4px;font-size:13px;overflow-wrap:anywhere;border:0;border-bottom:1px solid var(--line);border-radius:0;background:transparent}
#inspector .row:hover,#inspector .row:focus-visible{background:var(--raised)}
#inspector .row small{display:block;color:var(--muted);margin-top:4px;font-size:12px;line-height:1.5}
pre{white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.7 ui-monospace,SFMono-Regular,monospace;background:var(--field);padding:16px;border-radius:8px;color:var(--ink)}
summary{cursor:pointer;padding:12px 0;font-size:13px;line-height:1.5}
#inspector ul{padding-left:20px;color:var(--muted);font-size:14px;line-height:1.65}
#inspector li{margin-bottom:12px}
footer{flex:none;display:flex;align-items:center;gap:24px;padding:0 var(--space) 12px;min-height:28px}
#status{flex:1;min-width:0;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.legend{display:flex;gap:16px;flex:none;font-size:11px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border:1px solid currentColor;border-radius:3px}
.legend .folder{color:var(--folder)}.legend .file{color:var(--file)}.legend .method{color:var(--method)}
#tour{max-width:160px;min-width:0;font-size:12px}#coverage{font-size:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
@media(max-width:1100px){header{grid-template-columns:minmax(0,1fr) auto;gap:16px}#search-wrap{grid-column:1/-1;grid-row:2}#context{gap:12px}#hint{bottom:82px;left:20px;right:auto;max-width:calc(100% - 40px);text-align:left}}
@media(max-width:760px){
 :root{--space:20px}
 header{padding:16px var(--space) 0;gap:12px}
 h1{font-size:16px}#counts{font-size:12px}#tour{max-width:130px}
 #context{display:grid;grid-template-columns:1fr auto;gap:8px 12px;padding:10px 0}
 .breadcrumb{grid-column:1/-1}.breadcrumb button{max-width:240px;font-size:12px}
 #workspace{padding:12px;gap:12px;flex-direction:column}
 #stage{min-height:180px}
 #inspector{width:auto;max-width:none;min-height:0;flex:0 1 44%;padding:20px}
 #inspector .heading{margin-bottom:16px}
 #hint{bottom:76px;left:16px;max-width:calc(100% - 32px);font-size:12px}
 .canvas-controls{left:16px;bottom:16px}
 footer{padding-inline:16px}.legend{gap:10px}
}
@media(max-width:560px){header{grid-template-columns:minmax(0,1fr) auto;column-gap:12px}.actions{gap:0;padding:2px}.actions button,.actions select{padding-inline:8px}#tour{max-width:110px}#hint{display:none}.legend{display:none}}
@media(max-width:440px){header{grid-template-columns:minmax(0,1fr)}.actions{grid-row:2;justify-content:flex-start}#search-wrap{grid-row:3}#tour{max-width:none;flex:1}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>

ng remains possible)"},{"from":"tools/check_dist.py#main@34","to":"tools/check_dist.py#run@17","kind":"call","line":103,"text":"run(python, '-c', \"from slugify import slugify; \"\n                \"assert slugify('影師嗎', allow_unicode=True) == '影師嗎'\", cwd=scratch)","callback":false,"resolution":"same-file lexical name (Python dynamic binding remains possible)"},{"from":"tools/legacy_reference.py#slugify@76","to":"tools/legacy_reference.py#smart_truncate@28","kind":"call","line":193,"text":"smart_truncate(text, max_length, word_boundary, DEFAULT_SEPARATOR, save_order)","callback":false,"resolution":"same-file lexical name (Python dynamic binding remains possible)"}],"sources":{"setup.py":"\"\"\"Compatibility shim; metadata and build configuration live in pyproject.toml.\"\"\"\nfrom setuptools import setup\n\nsetup()\n","slugify/__init__.py":"from .special import *\nfrom .slugify import *\nfrom .__version__ import __title__\nfrom .__version__ import __author__\nfrom .__version__ import __author_email__\nfrom .__version__ import __description__\nfrom .__version__ import __url__\nfrom .__version__ import __license__\nfrom .__version__ import __copyright__\nfrom .__version__ import __version__\n","slugify/__main__.py":"from __future__ import annotations\n\nimport argparse\nimport sys\nfrom typing import Any\n\nfrom .slugify import slugify, DEFAULT_SEPARATOR\n\n\ndef parse_args(argv: list[str]) -> argparse.Namespace:\n    parser = argparse.ArgumentParser(description=\"Slug string\")\n\n    input_group = parser.add_argument_group(description=\"Input\")\n    input_group.add_argument(\"input_string\", nargs='*',\n                             help='Text to slugify')\n    input_group.add_argument(\"--stdin\", action='store_true',\n                             help=\"Take the text from STDIN\")\n\n    parser.add_argument(\"--no-entities\", action='store_false', dest='entities', default=True,\n                        help=\"Do not convert HTML entities to unicode\")\n    parser.add_argument(\"--no-decimal\", action='store_false', dest='decimal', default=True,\n                        help=\"Do not convert HTML decimal to unicode\")\n    parser.add_argument(\"--no-hexadecimal\", action='store_false', dest='hexadecimal', default=True,\n                        help=\"Do not convert HTML hexadecimal to unicode\")\n    parser.add_argument(\"--max-length\", type=int, default=0,\n                        help=\"Output string length, 0 for no limit\")\n    parser.add_argument(\"--word-boundary\", action='store_true', default=False,\n                        help=\"Truncate to complete word even if length ends up shorter than --max_length\")\n    parser.add_argument(\"--save-order\", action='store_true', default=False,\n                        help=\"When set and --max_length > 0 return whole words in the initial order\")\n    parser.add_argument(\"--separator\", type=str, default=DEFAULT_SEPARATOR,\n                        help=\"Separator between words. By default \" + DEFAULT_SEPARATOR)\n    parser.add_argument(\"--stopwords\", nargs='+',\n                        help=\"Words to discount\")\n    parser.add_argument(\"--regex-pattern\",\n                        help=\"Python regex pattern for disallowed characters\")\n    parser.add_argument(\"--no-lowercase\", action='store_false', dest='lowercase', default=True,\n                        help=\"Activate case sensitivity\")\n    parser.add_argument(\"--replacements\", nargs='+',\n                        help=\"\"\"Additional replacement rules e.g. \"|->or\", \"%%->percent\".\"\"\")\n    parser.add_argument(\"--allow-unicode\", action='store_true', default=False,\n                        help=\"Allow unicode characters\")\n\n    parser.add_argument('--algorithm', choices=('legacy', 'modern'), default=argparse.SUPPRESS,\n                        help='Slug algorithm (legacy default; modern explicitly opts into changed output)')\n    parser.add_argument('--backend', choices=('auto', 'text-unidecode', 'unidecode', 'anyascii'),\n                        default=argparse.SUPPRESS, help='Transliteration backend (auto preserves legacy preference)')\n    parser.add_argument('--replacement-stage', choices=('both', 'pre', 'post'), default=argparse.SUPPRESS,\n                        help='Apply replacement rules before, after, or both sides of cleanup')\n\n    args = parser.parse_args(argv[1:])\n\n    if args.input_string and args.stdin:\n        parser.error(\"Input strings and --stdin cannot work together\")\n\n    if args.replacements:\n        def split_check(repl: str) -> list[str]:\n            SEP = '->'\n            if SEP not in repl:\n                parser.error(\"Replacements must be of the form: ORIGINAL{SEP}REPLACED\".format(SEP=SEP))\n            return repl.split(SEP, 1)\n        args.replacements = [split_check(repl) for repl in args.replacements]\n\n    if args.input_string:\n        args.input_string = \" \".join(args.input_string)\n    elif args.stdin:\n        args.input_string = sys.stdin.read()\n\n    if not args.input_string:\n        args.input_string = ''\n\n    return args\n\n\ndef slugify_params(args: argparse.Namespace) -> dict[str, Any]:\n    params = dict(\n        text=args.input_string,\n        entities=args.entities,\n        decimal=args.decimal,\n        hexadecimal=args.hexadecimal,\n        max_length=args.max_length,\n        word_boundary=args.word_boundary,\n        save_order=args.save_order,\n        separator=args.separator,\n        stopwords=args.stopwords,\n        lowercase=args.lowercase,\n        replacements=args.replacements,\n        allow_unicode=args.allow_unicode\n    )\n    # Preserve historical parameter shape; omitted options use the API defaults.\n    for option in ('algorithm', 'backend', 'replacement_stage'):\n        if hasattr(args, option):\n            params[option] = getattr(args, option)\n    if args.regex_pattern is not None:\n        params['regex_pattern'] = args.regex_pattern\n    return params\n\n\ndef main(argv: list[str] | None = None) -> None:\n    \"\"\" Run this program \"\"\"\n    if argv is None:\n        argv = sys.argv\n    args = parse_args(argv)\n    params = slugify_params(args)\n    try:\n        print(slugify(**params))\n    except KeyboardInterrupt:\n        sys.exit(-1)\n\n\nif __name__ == '__main__':\n    main()\n","slugify/__version__.py":"__title__ = 'python-slugify'\n__author__ = 'Val Neekman'\n__author_email__ = 'info@neekware.com'\n__description__ = 'A Python slugify application that also handles Unicode'\n__url__ = 'https://github.com/un33k/python-slugify'\n__license__ = 'SPDX-License-Identifier: MIT'\n__copyright__ = 'Copyright 2022 Val Neekman @ Neekware Inc.'\n__version__ = '9.2.0'\n","slugify/_legacy.py":"\"\"\"Frozen legacy slugify implementation.\n\nDO NOT MODIFY. This module is the permanently frozen legacy output pipeline.\nMany deployed sites depend on its exact output, so its behavior must never\nchange. All improvements belong in the modern path (slugify/slugify.py).\nAny change to this file that alters legacy output is rejected on principle;\nthe only acceptable edits are non-behavioral (e.g. this docstring) verified\nbyte-for-byte against the frozen 2,688-case differential baseline.\n\"\"\"\nfrom __future__ import annotations\n\nimport re\nimport unicodedata\nfrom collections.abc import Iterable\nfrom html.entities import name2codepoint\nfrom importlib import import_module\nfrom typing import Literal\n\nCHAR_ENTITY_PATTERN = re.compile(r'&(%s);' % '|'.join(name2codepoint))\nDECIMAL_PATTERN = re.compile(r'&#(\\d+);')\nHEX_PATTERN = re.compile(r'&#x([\\da-fA-F]+);')\nQUOTE_PATTERN = re.compile(r\"[']+\")\nDISALLOWED_CHARS_PATTERN = re.compile(r'[^-a-zA-Z0-9]+')\nDISALLOWED_UNICODE_CHARS_PATTERN = re.compile(r'[\\W_]+')\nDUPLICATE_DASH_PATTERN = re.compile(r'-{2,}')\nNUMBERS_PATTERN = re.compile(r'(?\u003c=\\d),(?=\\d)')\nDEFAULT_SEPARATOR = '-'\n\nBackend = Literal['auto', 'text-unidecode', 'unidecode', 'anyascii']\nReplacementStage = Literal['both', 'pre', 'post']\n\n\ndef _decode_entities(text: str, entities: bool, decimal: bool, hexadecimal: bool) -> str:\n    if entities:\n        text = CHAR_ENTITY_PATTERN.sub(lambda m: chr(name2codepoint[m.group(1)]), text)\n    if decimal:\n        # Legacy substitution is all-or-nothing for each numeric reference kind.\n        try:\n            text = DECIMAL_PATTERN.sub(lambda m: chr(int(m.group(1))), text)\n        except (ValueError, OverflowError):\n            pass\n    if hexadecimal:\n        try:\n            text = HEX_PATTERN.sub(lambda m: chr(int(m.group(1), 16)), text)\n        except (ValueError, OverflowError):\n            pass\n    return text\n\n\ndef _transliterate(text: str, backend: Backend) -> str:\n    # Non-behavioral: every backend maps 7-bit ASCII to itself, so skip importing one.\n    if text.isascii():\n        return text\n    if backend == 'auto':\n        try:\n            module = import_module('unidecode')\n        except ModuleNotFoundError as error:\n            if error.name != 'unidecode':\n                raise\n            module = import_module('text_unidecode')\n    else:\n        module = import_module(backend.replace('-', '_'))\n    # These third-party modules share a string-to-string API; some are untyped.\n    result: str = getattr(module, 'anyascii' if backend == 'anyascii' else 'unidecode')(text)\n    return result\n\n\ndef smart_truncate(\n    string: str,\n    max_length: int = 0,\n    word_boundary: bool = False,\n    separator: str = \" \",\n    save_order: bool = False,\n) -> str:\n    \"\"\"Historical public truncation behavior, including character-set stripping.\n\n    Zero means unlimited; negative limits retain Python slicing semantics.\n    An empty separator raises ValueError, as in the legacy implementation.\n    \"\"\"\n    string = string.strip(separator)\n    if not max_length:\n        return string\n    if len(string) \u003c max_length:\n        return string\n    if not word_boundary:\n        return string[:max_length].strip(separator)\n    if separator not in string:\n        return string[:max_length]\n    truncated = ''\n    for word in string.split(separator):\n        if word:\n            next_len = len(truncated) + len(word)\n            if next_len \u003c max_length:\n                truncated += '{}{}'.format(word, separator)\n            elif next_len == max_length:\n                truncated += '{}'.format(word)\n                break\n            elif save_order:\n                break\n    if not truncated:\n        truncated = string[:max_length]\n    return truncated.strip(separator)\n\n\ndef slugify(\n    text: str | bytes | bytearray,\n    entities: bool = True,\n    decimal: bool = True,\n    hexadecimal: bool = True,\n    max_length: int = 0,\n    word_boundary: bool = False,\n    separator: str = DEFAULT_SEPARATOR,\n    save_order: bool = False,\n    stopwords: Iterable[str] = (),\n    regex_pattern: re.Pattern[str] | str | None = None,\n    lowercase: bool = True,\n    replacements: Iterable[Iterable[str]] = (),\n    allow_unicode: bool = False,\n    *,\n    replacement_stage: ReplacementStage = 'both',\n    backend: Backend = 'auto',\n) -> str:\n    \"\"\"Frozen legacy output pipeline. Do not change its behavior.\"\"\"\n    if not isinstance(text, str):\n        if not isinstance(text, (bytes, bytearray)):\n            raise TypeError(f'text must be str, bytes or bytearray, not {type(text).__name__}')\n        text = text.decode('utf-8', 'ignore')\n    if replacement_stage not in ('both', 'pre', 'post'):\n        raise ValueError(\"replacement_stage must be 'both', 'pre' or 'post'\")\n    if backend not in ('auto', 'text-unidecode', 'unidecode', 'anyascii'):\n        raise ValueError(\"backend must be 'auto', 'text-unidecode', 'unidecode' or 'anyascii'\")\n\n    if replacements and replacement_stage in ('both', 'pre'):\n        for old, new in replacements:\n            text = text.replace(old, new)\n\n    text = QUOTE_PATTERN.sub(DEFAULT_SEPARATOR, text)\n    if allow_unicode:\n        text = unicodedata.normalize('NFKC', text)\n    else:\n        text = _transliterate(unicodedata.normalize('NFKD', text), backend)\n    text = _decode_entities(text, entities, decimal, hexadecimal)\n    text = unicodedata.normalize('NFKC' if allow_unicode else 'NFKD', text)\n    if lowercase:\n        text = text.lower()\n    text = QUOTE_PATTERN.sub('', text)\n    text = NUMBERS_PATTERN.sub('', text)\n    pattern = regex_pattern or (DISALLOWED_UNICODE_CHARS_PATTERN if allow_unicode else DISALLOWED_CHARS_PATTERN)\n    text = re.sub(pattern, DEFAULT_SEPARATOR, text)\n    text = DUPLICATE_DASH_PATTERN.sub(DEFAULT_SEPARATOR, text).strip(DEFAULT_SEPARATOR)\n\n    if stopwords:\n        excluded = [word.lower() for word in stopwords] if lowercase else stopwords\n        text = DEFAULT_SEPARATOR.join(word for word in text.split(DEFAULT_SEPARATOR) if word not in excluded)\n    if replacements and replacement_stage in ('both', 'post'):\n        for old, new in replacements:\n            text = text.replace(old, new)\n\n    if max_length > 0:\n        text = smart_truncate(text, max_length, word_boundary, DEFAULT_SEPARATOR, save_order)\n    return text.replace(DEFAULT_SEPARATOR, separator) if separator != DEFAULT_SEPARATOR else text\n","slugify/slugify.py":"from __future__ import annotations\n\nimport re\nimport unicodedata\nfrom collections.abc import Iterable\nfrom html.entities import name2codepoint\nfrom importlib import import_module\nfrom typing import Literal\n\nfrom ._legacy import slugify as _legacy_slugify, smart_truncate\n\n__all__ = ['slugify', 'smart_truncate', 'Backend', 'ReplacementStage', 'Algorithm']\n\n\nCHAR_ENTITY_PATTERN = re.compile(r'&(%s);' % '|'.join(name2codepoint))\nDECIMAL_PATTERN = re.compile(r'&#(\\d+);')\nMODERN_HEX_PATTERN = re.compile(r'&#[xX]([\\da-fA-F]+);')\nQUOTE_PATTERN = re.compile(r\"[']+\")\nDISALLOWED_CHARS_PATTERN = re.compile(r'[^-a-zA-Z0-9]+')\nDISALLOWED_UNICODE_CHARS_PATTERN = re.compile(r'[\\W_]+')\nDUPLICATE_DASH_PATTERN = re.compile(r'-{2,}')\nNUMBERS_PATTERN = re.compile(r'(?\u003c=\\d),(?=\\d)')\nDEFAULT_SEPARATOR = '-'\n# Zero-width non-joiner/joiner: spelling-significant inside words in Indic,\n# Sinhala and Persian text (e.g. Sinhala \"ශ්‍රී\"), invisible noise elsewhere.\nWORD_JOINERS = frozenset('\\u200c\\u200d')\n# Python's \\w excludes nonspacing/spacing combining marks (Mn/Mc), which split\n# Devanagari, Tamil, Bengali, Thai, Arabic, Hebrew, etc. words apart.\nCOMBINING_MARK_CATEGORIES = frozenset(('Mn', 'Mc'))\n\nBackend = Literal['auto', 'text-unidecode', 'unidecode', 'anyascii']\nReplacementStage = Literal['both', 'pre', 'post']\nAlgorithm = Literal['legacy', 'modern']\n\n\ndef _numeric_reference(match: re.Match[str], base: int) -> str:\n    \"\"\"Leave invalid references for ordinary filtering, independently of neighbors.\"\"\"\n    try:\n        value = int(match.group(1), base)\n        if 0xD800 \u003c= value \u003c= 0xDFFF:\n            return match.group(0)\n        return chr(value)\n    except (ValueError, OverflowError):\n        return match.group(0)\n\n\ndef _decode_entities(text: str, entities: bool, decimal: bool, hexadecimal: bool) -> str:\n    if entities:\n        text = CHAR_ENTITY_PATTERN.sub(lambda m: chr(name2codepoint[m.group(1)]), text)\n    if decimal:\n        text = DECIMAL_PATTERN.sub(lambda m: _numeric_reference(m, 10), text)\n    if hexadecimal:\n        text = MODERN_HEX_PATTERN.sub(lambda m: _numeric_reference(m, 16), text)\n    return text\n\n\ndef _transliterate(text: str, backend: Backend) -> str:\n    # Every backend maps 7-bit ASCII to itself; skip importing one (text-unidecode's table is ~3 MB).\n    if text.isascii():\n        return text\n    if backend == 'auto':\n        try:\n            module = import_module('unidecode')\n        except ModuleNotFoundError as error:\n            if error.name != 'unidecode':\n                raise\n            module = import_module('text_unidecode')\n    else:\n        module = import_module(backend.replace('-', '_'))\n    # These third-party modules share a string-to-string API; some are untyped.\n    result: str = getattr(module, 'anyascii' if backend == 'anyascii' else 'unidecode')(text)\n    return result\n\n\ndef _is_combining_mark(char: str) -> bool:\n    # Variation selectors are Mn but select emoji/glyph styles, not spelling.\n    if '\\ufe00' \u003c= char \u003c= '\\ufe0f' or '\\U000e0100' \u003c= char \u003c= '\\U000e01ef':\n        return False\n    return unicodedata.category(char) in COMBINING_MARK_CATEGORIES\n\n\ndef _replace_disallowed_unicode(text: str) -> str:\n    \"\"\"Modern Unicode-mode filter: [\\\\W_]+ -> '-', but keep words whole.\n\n    A combining mark is a word character when it continues a word; a ZWNJ/ZWJ\n    is kept only between word parts. Identical to the plain [\\\\W_]+ filter\n    for text without combining marks or joiners.\n    \"\"\"\n    if text.isascii():  # No marks or joiners possible: keep the fast C regex path.\n        return DISALLOWED_UNICODE_CHARS_PATTERN.sub(DEFAULT_SEPARATOR, text)\n    chars: list[str] = []\n    in_word = False\n    last = len(text) - 1\n    for index, char in enumerate(text):\n        if char.isalnum():  # Same definition as str-pattern \\w, minus '_'.\n            in_word = True\n        elif in_word and _is_combining_mark(char):\n            pass\n        elif in_word and char in WORD_JOINERS and index \u003c last and (\n                text[index + 1].isalnum() or _is_combining_mark(text[index + 1])):\n            pass\n        else:\n            in_word = False\n            char = DEFAULT_SEPARATOR\n        chars.append(char)\n    return ''.join(chars)\n\n\ndef _modern_truncate(text: str, max_length: int, word_boundary: bool, separator: str, save_order: bool) -> str:\n    \"\"\"Budget internal dash-separated tokens before mapping output delimiters.\n\n    Output delimiters may also occur in words; never strip or split emitted text.\n    Post replacements retain the historical global dash-to-separator mapping.\n    \"\"\"\n    if max_length \u003c= 0:\n        return text.replace(DEFAULT_SEPARATOR, separator)\n    output_length = len(text) + text.count(DEFAULT_SEPARATOR) * (len(separator) - 1)\n    if output_length \u003c= max_length:\n        return text.replace(DEFAULT_SEPARATOR, separator)\n    tokens = text.split(DEFAULT_SEPARATOR)\n    if word_boundary:\n        words: list[str] = []\n        length = 0\n        previous_index = 0\n        first_word = True\n        for index, word in enumerate(tokens):\n            if not word:\n                continue\n            # Keep the full delimiter run attached to each retained word.\n            # Skipping an oversized first word must not add a leading delimiter.\n            delimiter = separator * (index - previous_index) if words or first_word else ''\n            previous_index = index\n            first_word = False\n            next_length = length + len(delimiter) + len(word)\n            if next_length \u003c= max_length:\n                words.append(delimiter + word)\n                length = next_length\n            elif save_order:\n                break\n        if words:\n            return ''.join(words)\n    # A hard cut may shorten a word but must not emit a partial/trailing delimiter.\n    parts: list[str] = []\n    length = 0\n    previous_index = 0\n    for index, word in enumerate(tokens):\n        if not word:\n            continue\n        # Keep repeated delimiters with the next nonempty word until it fits.\n        delimiter = separator * (index - previous_index)\n        remaining = max_length - length - len(delimiter)\n        if remaining \u003c= 0:\n            break\n        # A cut must not leave an invisible joiner dangling at the end.\n        parts.append(delimiter + word[:remaining].rstrip(''.join(WORD_JOINERS)))\n        length += len(delimiter) + min(len(word), remaining)\n        previous_index = index\n        if len(word) > remaining:\n            break\n    return ''.join(parts)\n\n\ndef _modern_slugify(\n    text: str | bytes | bytearray,\n    entities: bool,\n    decimal: bool,\n    hexadecimal: bool,\n    max_length: int,\n    word_boundary: bool,\n    separator: str,\n    save_order: bool,\n    stopwords: Iterable[str],\n    regex_pattern: re.Pattern[str] | str | None,\n    lowercase: bool,\n    replacements: Iterable[Iterable[str]],\n    allow_unicode: bool,\n    replacement_stage: ReplacementStage,\n    backend: Backend,\n) -> str:\n    # bool is an int subclass: legacy silently treats max_length=True as 1.\n    # Modern rejects it, and a non-str separator, up front.\n    if isinstance(max_length, bool) or not isinstance(max_length, int):\n        raise TypeError(f\"max_length must be an int, not {type(max_length).__name__}\")\n    if not isinstance(separator, str):\n        raise TypeError(f\"separator must be str, not {type(separator).__name__}\")\n    if not isinstance(text, str):\n        if not isinstance(text, (bytes, bytearray)):\n            raise TypeError(f'text must be str, bytes or bytearray, not {type(text).__name__}')\n        text = text.decode('utf-8', 'ignore')\n    if replacement_stage not in ('both', 'pre', 'post'):\n        raise ValueError(\"replacement_stage must be 'both', 'pre' or 'post'\")\n    if backend not in ('auto', 'text-unidecode', 'unidecode', 'anyascii'):\n        raise ValueError(\"backend must be 'auto', 'text-unidecode', 'unidecode' or 'anyascii'\")\n\n    # Materialize rules once: consumption of an iterator would affect output.\n    rules = tuple((old, new) for old, new in replacements) if replacements else ()\n    if rules and replacement_stage in ('both', 'pre'):\n        for old, new in rules:\n            text = text.replace(old, new)\n\n    text = _decode_entities(text, entities, decimal, hexadecimal)\n    text = QUOTE_PATTERN.sub(DEFAULT_SEPARATOR, text)\n    if allow_unicode:\n        text = unicodedata.normalize('NFKC', text)\n    else:\n        text = _transliterate(unicodedata.normalize('NFKD', text), backend)\n    text = unicodedata.normalize('NFKC' if allow_unicode else 'NFKD', text)\n    if lowercase:\n        text = text.lower()\n    text = QUOTE_PATTERN.sub('', text)\n    text = NUMBERS_PATTERN.sub('', text)\n    if regex_pattern:\n        text = re.sub(regex_pattern, DEFAULT_SEPARATOR, text)\n    elif allow_unicode:\n        text = _replace_disallowed_unicode(text)\n    else:\n        text = DISALLOWED_CHARS_PATTERN.sub(DEFAULT_SEPARATOR, text)\n    text = DUPLICATE_DASH_PATTERN.sub(DEFAULT_SEPARATOR, text).strip(DEFAULT_SEPARATOR)\n\n    if stopwords:\n        excluded = {word.lower() if lowercase else word for word in stopwords}\n        text = DEFAULT_SEPARATOR.join(word for word in text.split(DEFAULT_SEPARATOR) if word not in excluded)\n    if rules and replacement_stage in ('both', 'post'):\n        for old, new in rules:\n            text = text.replace(old, new)\n\n    return _modern_truncate(text, max_length, word_boundary, separator, save_order)\n\n\ndef slugify(\n    text: str | bytes | bytearray,\n    entities: bool = True,\n    decimal: bool = True,\n    hexadecimal: bool = True,\n    max_length: int = 0,\n    word_boundary: bool = False,\n    separator: str = DEFAULT_SEPARATOR,\n    save_order: bool = False,\n    stopwords: Iterable[str] = (),\n    regex_pattern: re.Pattern[str] | str | None = None,\n    lowercase: bool = True,\n    replacements: Iterable[Iterable[str]] = (),\n    allow_unicode: bool = False,\n    *,\n    replacement_stage: ReplacementStage = 'both',\n    backend: Backend = 'auto',\n    algorithm: Algorithm = 'legacy',\n) -> str:\n    \"\"\"Make a slug with the legacy output pipeline by default, permanently.\n\n    algorithm='legacy' (the default) dispatches to the frozen legacy pipeline in\n    slugify._legacy, which must never change. algorithm='modern' opts into early\n    entity decoding, reusable iterator rules, stable stopword membership, a final\n    emitted-character length budget, and up-front argument type validation.\n    Bytes and bytearray are decoded as UTF-8, ignoring invalid bytes.\n    replacements are ordered literal rules, before and after cleanup by default;\n    replacement_stage selects 'pre', 'post' or 'both'. Post rules are unfiltered.\n    regex_pattern matches disallowed characters; stopwords match internal words.\n    allow_unicode uses NFKC without transliteration. backend='auto' prefers\n    installed Unidecode, falling back to text-unidecode; explicit choices do not\n    fall back. All new controls are keyword-only.\n    \"\"\"\n    if algorithm not in ('legacy', 'modern'):\n        raise ValueError(\"algorithm must be 'legacy' or 'modern'\")\n    if algorithm == 'legacy':\n        return _legacy_slugify(\n            text, entities, decimal, hexadecimal, max_length, word_boundary,\n            separator, save_order, stopwords, regex_pattern, lowercase,\n            replacements, allow_unicode,\n            replacement_stage=replacement_stage, backend=backend)\n    return _modern_slugify(\n        text, entities, decimal, hexadecimal, max_length, word_boundary,\n        separator, save_order, stopwords, regex_pattern, lowercase,\n        replacements, allow_unicode, replacement_stage, backend)\n","slugify/special.py":"from __future__ import annotations\n\n\ndef add_uppercase_char(char_list: list[tuple[str, str]]) -> list[tuple[str, str]]:\n    \"\"\" Given a replacement char list, this adds uppercase chars to the list \"\"\"\n\n    # Collect additions to avoid modifying input during iteration\n    # and ensure atomicity on error\n    insertions = []\n    for item in char_list:\n        char, xlate = item\n        upper_dict = char.upper(), xlate.capitalize()\n        if upper_dict not in char_list and char != upper_dict[0]:\n            insertions.append(upper_dict)\n\n    # Apply all insertions to original list (maintains documented in-place modification)\n    for upper_dict in insertions:\n        char_list.insert(0, upper_dict)\n\n    return char_list\n\n\n# Language specific pre translations\n# Source awesome-slugify\n\n_CYRILLIC = [      # package defaults:\n    (u'ё', u'e'),    # io / yo\n    (u'я', u'ya'),   # ia\n    (u'х', u'h'),    # kh\n    (u'у', u'y'),    # u\n    (u'щ', u'sch'),  # sch\n    (u'ю', u'u'),    # iu / yu\n]\nCYRILLIC = add_uppercase_char(_CYRILLIC)\n\n_GERMAN = [        # package defaults:\n    (u'ä', u'ae'),   # a\n    (u'ö', u'oe'),   # o\n    (u'ü', u'ue'),   # u\n]\nGERMAN = add_uppercase_char(_GERMAN)\n\n_GREEK = [         # package defaults:\n    (u'χ', u'ch'),   # kh\n    (u'Ξ', u'X'),    # Ks\n    (u'ϒ', u'Y'),    # U\n    (u'υ', u'y'),    # u\n    (u'ύ', u'y'),\n    (u'ϋ', u'y'),\n    (u'ΰ', u'y'),\n]\nGREEK = add_uppercase_char(_GREEK)\n\n# Pre translations\nPRE_TRANSLATIONS = CYRILLIC + GERMAN + GREEK\n","tests/__init__.py":"","tests/test_add_uppercase_error.py":"\"\"\"Regression test for add_uppercase_char error handling.\n\nTests that add_uppercase_char either completes atomically or leaves\nthe input list unchanged on error.\n\"\"\"\nfrom __future__ import annotations\n\nimport pytest\nfrom slugify.special import add_uppercase_char\n\n\nclass TestAddUppercaseCharAtomicity:\n\n    def test_list_unmodified_on_unpack_error(self) -> None:\n        \"\"\"Input list should remain unchanged when unpack fails.\n\n        Before fix: the list was partially modified with items inserted\n        before the failing element, leaving state inconsistent.\n        \"\"\"\n        # Create list with malformed second element\n        original = [('a', 'b')]\n        original.append(('bad',))  # type: ignore[arg-type]  # malformed - only 1 element\n\n        with pytest.raises(ValueError):\n            add_uppercase_char(original)  # malformed data triggers ValueError\n\n        # After fix: the first valid item should NOT have been processed\n        # Before fix: original would be [('A', 'B'), ('a', 'b'), ('bad',)]\n        assert original == [('a', 'b'), ('bad',)], (\n            f\"List should remain unmodified on error, got {original}\"\n        )\n\n    def test_successful_processing_modifies_list(self) -> None:\n        \"\"\"Verify normal operation still modifies list in place.\"\"\"\n        original = [('x', 'y')]\n        result = add_uppercase_char(original)\n\n        # Should add uppercase version at position 0\n        assert result == [('X', 'Y'), ('x', 'y')]\n        assert original is result  # same object\n\n    def test_empty_list_returns_empty(self) -> None:\n        \"\"\"Empty list is valid and returns empty list.\"\"\"\n        empty: list[tuple[str, str]] = []\n        result = add_uppercase_char(empty)\n\n        assert result == []\n        assert empty == []\n","tests/test_cli_interrupt.py":"\"\"\"CLI entry-point contracts without changing frozen slug algorithms.\"\"\"\nimport importlib\nimport sys\nfrom unittest.mock import patch\nimport pytest\n\ncli = importlib.import_module('slugify.__main__')\n\n\ndef test_main_uses_process_arguments_when_omitted(capsys):\n    with patch.object(sys, 'argv', ['slugify', 'Hello', 'World']):\n        cli.main()\n    assert capsys.readouterr().out == 'hello-world\\n'\n\n\ndef test_keyboard_interrupt_exits_without_traceback(capsys):\n    with patch.object(cli, 'slugify', side_effect=KeyboardInterrupt):\n        with pytest.raises(SystemExit) as error:\n            cli.main(['slugify', 'hello'])\n    assert error.value.code == -1\n    captured = capsys.readouterr()\n    assert captured.out == ''\n    assert captured.err == ''\n","tests/test_legacy.py":"# -*- coding: utf-8 -*-\nimport io\nimport sys\nimport unittest\nfrom contextlib import contextmanager\n\nfrom slugify import PRE_TRANSLATIONS\nfrom slugify import slugify\nfrom slugify import smart_truncate\nfrom slugify.__main__ import slugify_params, parse_args\n\n\nclass TestSlugify(unittest.TestCase):\n\n    def test_extraneous_seperators(sel , stopwords=['Öländ'], lowercase=False)\n        self.assertEqual(r, 'thIs-Has-a-öländ')\n\n    def test_multiple_stopword_occurances(self):\n        txt = 'the quick brown fox jumps over the lazy dog'\n        r = slugify(txt, allow_unicode=True, stopwords=['the'])\n        self.assertEqual(r, 'quick-brown-fox-jumps-over-lazy-dog')\n\n    def test_differently_cased_stopword_match(self):\n        txt = 'Foo A FOO B foo C'\n        r = slugify(txt, allow_unicode=True, stopwords=['foo'])\n        self.assertEqual(r, 'a-b-c')\n\n        txt = 'Foo A FOO B foo C'\n        r = slugify(txt, allow_unicode=True, stopwords=['FOO'])\n        self.assertEqual(r, 'a-b-c')\n\n    def test_multiple_stopwords(self):\n        txt = 'the quick brown fox jumps over the lazy dog in a hurry'\n        r = slugify(txt, allow_unicode=True, stopwords=['the', 'in', 'a', 'hurry'])\n        self.assertEqual(r, 'quick-brown-fox-jumps-over-lazy-dog')\n\n    def test_stopwords_with_different_separator(self):\n        txt = 'the quick brown fox jumps over the lazy dog'\n        r = slugify(txt, allow_unicode=True, stopwords=['the'], separator=' ')\n        self.assertEqual(r, 'quick brown fox jumps over lazy dog')\n\n    def test_html_entities_on(self):\n        txt = 'foo &amp; bar'\n        r = slugify(txt, allow_unicode=True)\n        self.assertEqual(r, 'foo-bar')\n\n    def test_html_entities_off(self):\n        txt = 'foo &amp; bår'\n        r = slugify(txt, allow_unicode=True, entities=False)\n        self.assertEqual(r, 'foo-amp-bår')\n\n    def test_html_decimal_on(self):\n        txt = '&#381;'\n        r = slugify(txt, allow_unicode=True, decimal=True)\n        self.assertEqual(r, 'ž')\n\n    def test_html_decimal_off(self):\n        txt = '&#381;'\n        r = slugify(txt, allow_unicode=True, entities=False, decimal=False)\n        self.assertEqual(r, '381')\n\n    def test_html_hexadecimal_on(self):\n        txt = '&#x17D;'\n        r = slugify(txt, allow_unicode=True, hexadecimal=Tr
